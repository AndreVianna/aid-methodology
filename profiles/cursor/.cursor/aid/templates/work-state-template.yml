# Work State -- work-NNN-{name}
#
# This is the WORK-LEVEL STATE.yml template. It is divided into three zones:
#   FRONTMATTER (single-writer, machine-parsed scalars) -- top-level keys,
#     verbatim: pipeline identity, work-level lifecycle/phase/approval
#     scalars, and (for flattened single-delivery works only) the delivery
#     lifecycle/gate scalars. Written ONLY by `writeback-state.sh` (surgical
#     single-key write; every other line is reproduced byte-for-byte).
#   AUTHORED (single-writer, YAML structures under a key, one key per former
#     markdown section) -- interview, lifecycle_history, deploy,
#     delivery_lifecycle (incl. its tasks_lifecycle child), delivery_gate, qa.
#   DERIVED (read-only, assembled at read time) -- Features State,
#     Plan/Deliveries, Tasks State, Delivery Gates, Calibration Log,
#     Dispatches. NOT represented here -- no key at all. A reader seeing no
#     key derives the same union it derives today. Agents that write state
#     must target the per-unit STATE.yml files instead. `qa` is the one
#     former-DERIVED name that keeps a key here, because on the flattened
#     Lite path it is AUTHORED.
#
# Writer legend -- stated in full-line comments above each key, NEVER as a
# trailing comment on the key itself (D-3):
#   [W] writeback-state.sh is the sole writer (surgical single-key write)
#   [A] authored by this work's active branch (single writer)
#
# This is the single state file for THIS work -- the full dev lifecycle from
# req to spec to plan to impl to deploy. One STATE.yml per
# .aid/works/work-NNN-{name}/ directory. See also: per-delivery
# delivery-NNN/STATE.yml (delivery lifecycle + gate + delivery-scoped Q&A +
# derived task rollup) and per-task delivery-NNN/tasks/task-NNN/STATE.yml
# (mutable task cells).
#
# Artifact files (REQUIREMENTS.md, per-feature SPEC.md, PLAN.md, per-task
# DETAIL.md) keep their inline "## Change Log" sections -- that is content
# history (what changed in the document), distinct from process state (where
# are we in the workflow). Both are useful; they live in different places.
#
# The AUTHORED delivery_lifecycle / tasks_lifecycle / delivery_gate keys
# (singular) apply ONLY to single-delivery flattened works (no
# deliveries/delivery-NNN/ wrapper). They are promoted verbatim from
# delivery-state-template.yml / task-state-template.yml and are distinct from
# the plural DERIVED Delivery Gates / Plan-Deliveries / Tasks State union
# views, which are omitted here entirely. Left absent (keys omitted) for full
# multi-delivery works, where each delivery's own lifecycle/gate lives in its
# delivery-NNN/STATE.yml and each task's own state lives in its
# delivery-NNN/tasks/task-NNN/STATE.yml instead.
#
# Full-layout omission rule: a full multi-delivery work's STATE.yml is
# IDENTICAL to this template minus these keys: delivery_state, gate_tier,
# gate_grade, gate_timestamp (the four flattened-only gate/delivery scalars),
# minus delivery_lifecycle, tasks_lifecycle, delivery_gate (each lives in its
# own delivery/task file instead), and minus qa (DERIVED on the full path).
#
# Optional `ticket_ref` scalar (top-level, both layouts): links this work to
# an external tracker item ({connector-stem}:{external-id}, e.g.
# jira:PROJ-123). Left `--` when this work is not linked; readers/dashboard
# ignore it. Nearest-ancestor resolution + MCP-first consumption contract:
# canonical/aid/templates/connectors/consumption-protocol.md. `ticket_ref` is
# a lifecycle-unit field only -- the connector descriptor schema is unchanged.
#
# STATE ADVANCEMENT ORDERING (authoritative source; schemas.md inline copy is downstream)
#
# Ordered from most-advanced to least-advanced:
#   1. Done           -- task completed and accepted; all subtasks resolved
#   2. Canceled       -- resolved terminal (explicitly abandoned); ranks just below Done
#   3. In Review      -- work submitted; awaiting reviewer decision
#   4. In Progress    -- actively being executed on its delivery branch
#   5. Blocked        -- attempted but impeded; recoverable-in-place; more actionable than Failed
#   6. Failed         -- completed attempt rejected; a parallel branch may have superseded
#   7. Pending        -- not yet started
#
# Rationale: the dashboard "most-advanced wins" reconcile answers "how far has
# this work gotten across all worktree branches." Done/Canceled are
# terminal-resolved and rank highest. In Review outranks In Progress (review
# is a later pipeline stage). Blocked outranks Failed because a blocked task
# is recoverable-in-place and signals "needs attention now," whereas a failed
# task represents a completed-but-rejected attempt that a parallel branch may
# have already superseded -- surfacing "blocked" is the more actionable
# signal. Both Blocked and Failed rank above Pending because they represent
# work that was attempted and surfaced information (more informative than
# "not started").
#
# Closed enum VALUES (unchanged): Pending | In Progress | In Review | Blocked | Done | Failed | Canceled
#
# This ordering is encoded ONCE here. Both reader twins (Python + Node)
# reference schemas.md for the ordered list at runtime; schemas.md carries an
# inline copy derived from this source.

# [W]
#   path: lite | full  -- lite = flattened (no deliveries/ wrapper); full = deliveries/delivery-NNN/ wrapper
#   initiator: aid-describe | aid-{shortcut-skill}  -- the pipeline-starting skill: aid-describe, or a shortcut-catalog.yml skill (e.g. aid-fix, aid-refactor, aid-create-api)
pipeline:
  path: lite
  initiator: aid-describe
# [W]
started: '2026-01-01'
# [W] resolved at runtime by `bash canonical/aid/scripts/config/read-setting.sh --skill {phase} --key minimum_grade --default A`; source is `.aid/settings.yml`
minimum_grade: A
# [W] 'yes' | 'no' -- quoted, see NFR-2 / D-5
user_approved: 'no'
# [W] Running | Paused-Awaiting-Input | Blocked | Completed | Canceled
lifecycle: Running
# [W] Describe | Define | Specify | Plan | Detail | Execute
phase: Describe
# [W] aid-{skill} | none
active_skill: none
# [W]
updated: '2026-01-01T00:00:00Z'
# [W] set only when lifecycle = Paused-Awaiting-Input
pause_reason: --
# [W] set only when lifecycle = Blocked
block_reason: --
# [W] e.g. IMPEDIMENT-task-NNN.md, or the failed gate
block_artifact: --
# [W] {connector-stem}:{external-id} | -- -- OPTIONAL; e.g. jira:PROJ-123; see the ticket_ref note above
ticket_ref: --

# Flattened single-delivery works only -- omit these 4 keys for full works.
# [W] Pending-Spec | Specified | Executing | Gated | Done | Blocked
delivery_state: Pending-Spec
# [W] Small | Medium | Large
gate_tier: Small
# [W]
gate_grade: Pending
# [W]
gate_timestamp: --

# [A] updated by aid-describe as each section is completed.
#   state: In Progress | Complete | Approved
#   grade: {grade} | Pending
#   sections[].state: Pending | Complete
interview:
  state: 'In Progress'
  grade: Pending
  sections:
    - id: 1
      name: Objective
      state: Pending
      updated: --
    - id: 2
      name: 'Problem Statement'
      state: Pending
      updated: --
    - id: 3
      name: 'Users & Stakeholders'
      state: Pending
      updated: --
    - id: 4
      name: Scope
      state: Pending
      updated: --
    - id: 5
      name: 'Functional Requirements'
      state: Pending
      updated: --
    - id: 6
      name: 'Non-Functional Requirements'
      state: Pending
      updated: --
    - id: 7
      name: Constraints
      state: Pending
      updated: --
    - id: 8
      name: 'Assumptions & Dependencies'
      state: Pending
      updated: --
    - id: 9
      name: 'Acceptance Criteria'
      state: Pending
      updated: --
    - id: 10
      name: Priority
      state: Pending
      updated: --

# [A] written by the orchestrator on the work's active branch (single
#     writer). Append-only audit trail of phase transitions and gate
#     approvals, newest LAST (append to bottom).
lifecycle_history:
  - date: '2026-01-01'
    event: 'Work created'
    grade: --
    notes: 'Initial scaffold by aid-config'

# [A] aid-deploy only; one entry per delivery (never derived from child
#     files; aid-deploy is the sole author):
#   - delivery / state / pr / kb_updated / tag / notes
deploy: []

# [A] flattened only; single writer: this work's active branch. Written by
#     aid-plan, aid-specify, aid-execute across the delivery pipeline for the
#     synthesized delivery-001. Never derived from task rollup. `updated` is
#     a writer-targeted child key (L-2).
delivery_lifecycle:
  updated: '2026-01-01T00:00:00Z'
  block_reason: --
  block_artifact: --

# [W] flattened only -- one entry per task, keyed by task-NNN, REPLACING the
#     now-absent per-task STATE.yml (each task is tasks/task-NNN/DETAIL.md
#     only -- immutable, no sibling STATE.yml). Written by
#     `writeback-state.sh --task-id NNN --field <field> --value <value>`,
#     targeting this mapping instead of a delivery-NNN/tasks/task-NNN/STATE.yml.
#     Mirrors the fields of task-state-template.yml (state/review/elapsed/
#     notes/display_name), one entry per task-NNN.
#   state: Pending | In Progress | In Review | Blocked | Done | Failed | Canceled
tasks_lifecycle: {}

# [A] flattened only; single writer: the delivery-gate closing step of
#     aid-execute on this work's active branch, written via
#     `writeback-state.sh --delivery-id 001 --block ...`. Distinct from
#     per-task quick-check findings -- the gate aggregates those deferred
#     [HIGH] rows (via .aid/works/{work}/delivery-001-issues.md; see
#     canonical/aid/templates/delivery-issues.md) and runs a full grade.sh
#     pass. `issue_list` is a writer-targeted child key (--append-issue, L-2).
#   issue_list: severity-tagged strings, or [] when the gate passed clean
delivery_gate:
  issue_list: []

# [A] flattened Lite only (AUTHORED here, not derived); one entry per
#     question:
#   - id / category (e.g. Architecture, Requirements, Security) /
#     impact: High | Medium | Low | Required /
#     state: Pending | Answered | Skipped /
#     context / suggested / answer / applied_to
qa: []
