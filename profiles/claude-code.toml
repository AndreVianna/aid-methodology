# Profile: Claude Code (Anthropic Claude Code)
# Encodes the Claude Code host tool's install conventions.
# Consumed by the profile renderer; agents and placement data are emitted.

root_dir     = ".claude"
root_file    = "AGENTS.md"
agent_format = "markdown"
skill_mirrors = [".claude/skills"]
worktree_root = ".claude/worktrees"
context_import = "CLAUDE.md"

[tool_names]
# Identity map: abstract tool names pass through unchanged for Claude Code.

[model_tiers]
large  = "opus"
medium = "sonnet"
small  = "haiku"

[capabilities]
hooks                  = true
skill_chaining         = true
background_execution   = true
stop_hook_autocontinue = true
