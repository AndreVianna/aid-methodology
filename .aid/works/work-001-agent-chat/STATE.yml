  - date: '2026-09-02'
    event: 'Feature 001 spike -- BOM found: Cursor prefixes its stdin JSON with EF BB BF; F10 corrected'
    outcome: 'loop_count IS delivered. Prior "absent" reading was a BOM parse failure. F8 restored. Rich undocumented payload found'
    notes: >-
      Run T5-stdin-a captured the raw stdin bytes and they begin with the three characters shown as
      i-diaeresis, guillemet, inverted-question-mark, which are EF BB BF -- the UTF-8 byte-order mark.
      RFC 8259 does not permit a BOM in JSON, so json.loads rejects the whole document with
      'Expecting value: line 1 column 1 (char 0)', an error that names the first character and so
      reads like malformed JSON rather than a valid document wearing a hat. Reading stdin as text made
      it worse, because the platform locale rendered those bytes as cp1252 and the BOM never even
      appeared as U+FEFF. This must be stated plainly: the PREVIOUS entry concluded loop_count 'does
      not reach the hook' and withdrew F8's re-entry argument on that basis, and BOTH were wrong.
      loop_count is delivered, its value in this run was 0, and the failure was the spike's parser.
      F8's claim that Feature 003 can read loop_count instead of inventing a sentinel is RESTORED. The
      apparatus now reads stdin as bytes and decodes with utf-8-sig, verified against the operator's
      exact payload including the BOM, and still handles BOM-less and empty stdin correctly. The BOM
      is a real interoperability constraint rather than only a spike bug: any hook piping Cursor's
      stdin into a strict JSON parser fails on the first byte with an error pointing at the payload
      instead of the encoding, so a waker must decode utf-8-sig or strip U+FEFF, and emitting a BOM
      ahead of JSON is worth reporting upstream as non-conforming. The payload is also far richer than
      documented. Documented: status, loop_count. Actually delivered and undocumented:
      conversation_id, generation_id, model, model_id, model_params, input_tokens, output_tokens,
      cache_read_tokens, cache_write_tokens. conversation_id is the most consequential -- a stable
      per-conversation identity is exactly what a chat channel needs to name a peer, and the spec had
      assumed one would have to be invented; generation_id distinguishes a re-fire from a fresh stop.
      Undocumented fields can vanish without notice, so conversation_id should be an optimisation with
      a fallback rather than load-bearing. Also: followup_message confirmed working across two runs
      now, and latency is five samples -- 3.264, 3.890, 3.368, 3.875, 4.303 s, mean 3.740 -- where the
      observed MAXIMUM keeps rising as samples accumulate, so any derived timeout should use the
      maximum with headroom rather than the mean.
    applied_to: 'FINDINGS.md (F10 rewritten, F8 restored, latency, ladder); throwaway/spike_hook.py'
  - date: '2026-09-03'
    event: 'Spike findings folded into REQUIREMENTS.md; AC-20 restated; Feature 003 unblocked'
    outcome: 'Requirements now carry the measured constraints. 6 new requirements, 4 new criteria, AC-20 premise fixed'
    notes: >-
      Four of the ten findings were absent from REQUIREMENTS.md entirely -- re-entry and loop_count,
      conversation_id, the BOM, and followup_message -- so specifying 002 or 003 would have meant
      writing correct specs against superseded text. Folded in as follows. FR-5.6: every adapter
      carries a re-entry rule, because waking is inherently a loop and 'block on every stop event' is
      not implementable. FR-5.7: the woken turn requires no authorisation, since a gate on that
      action is a human and an autonomous channel cannot wait on one. FR-5.8: the block stays inside
      the host's hook timeout and the adapter SETS that timeout, because the platform default measured
      under 60 s and an over-run leaks a process whose socket stays open. FR-5.9: the wake contract is
      per-host and taken from documentation, and the adapter tolerates a byte-order mark. FR-5.10: no
      assumption about how the host invokes the hook -- not the shell, not PATH. FR-2.4: a
      host-supplied conversation identity is preferred where offered and never depended on. Four new
      criteria AC-23 to AC-26 cover the loop, the unattended turn, the orphan, and the BOM. AC-20's
      third question was restated: it had asked for 'the measured limit on how long a Cursor stop hook
      may block BEFORE THE HOST KILLS IT, as a number', and the spike found neither a kill nor a
      constant -- the bound is the configured timeout and the host abandons rather than kills -- so in
      its original form the question had no honest answer. It now asks what bounds the block and what
      the host does when that bound is passed, and a note records why. Section 8's host table was
      updated from deferred-proof to measured on both Claude Code and Cursor, and the paragraph
      warning that FR-5 might have no demonstrated instance now records that the risk is retired;
      Cursor's row notes that its documentation denies the capability its hook demonstrably provides,
      so documentation silence is evidence about documentation rather than about capability. Feature
      003 is no longer blocked: its blocking note said it could not be specified before a number that
      does not exist, and it now points at the five requirements the spike produced instead, plus the
      3.7 s wake latency and the instruction to budget from the observed maximum rather than the mean.
      Feature 002 gains FR-2.4 and a note naming the identity fork the specifier must take
      deliberately rather than by default. Feature 001 carries a Status line stating it executed, that
      AC-20 is NOT yet satisfied because the cross-machine question has no recorded outcome, and that
