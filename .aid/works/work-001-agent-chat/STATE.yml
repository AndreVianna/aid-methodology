      Feature 005 is recorded as the weakest cohesion of the five rather than presented as clean.
  - date: '2026-09-02'
    event: 'Feature 001 apparatus built and smoke-tested (out of phase, deliberately)'
    outcome: '3 throwaway scripts, gitignored; 4 host tests remain unrun'
    notes: >-
      The spike blocks Feature 003, and it needs two live host sessions that a cloud agent cannot
      be -- the protocols own validity rule says a session holding a foreground shell call open is
      busy, not idle, and a run arranged that way is invalid, so this process cannot be both the
      harness under test and the observer. What it CAN do is build the apparatus, so it did:
      spike_stub_node.py, spike_hook.py and spike_probe.py, written to the A+ specification and
      smoke-tested end to end. Verified here -- the endpoint contract including all three 400
      cases and the 404, seq incrementing per request, refusal to start on a bound port, a
      SURVIVED run with 13 beats and the act reaching the stub, a KILLED run where SIGTERM at 1.5s
      of a 30s block produced signal 15 with the probe confirming the pid gone, the arm-once
      sentinel refusing a second block, and VOID detection when the stub answers first. One defect
      found and fixed in the process: default log paths resolved from the working directory, which
      created a nested throwaway/throwaway when run from inside the scripts own folder and would
      have put logs somewhere unpredictable when a host spawned a hook -- they now resolve from the
      scripts own location, verified by running from /tmp. NOT verified and not verifiable here:
      anything a host does. All four tests are unrun. SPIKE-RUNBOOK.md carries the operator steps,
      and the hook placement is the operators by requirement, not by convenience -- FR-0.4 forbids
      the product writing any host tools configuration, and the specification puts the hook in a
      scratch project outside this repository.
  - date: '2026-09-02'
    event: 'Cross-Reference -- 2 cycles, D then B, closing A+'
    outcome: 'A+ (8 ledger rows, all Fixed); minimum A met'
    notes: >-
      Cycle 1 graded D on six findings, five sharing one root cause the re-decomposition had
      created: it REUSED feature ids, so prose carried across the change kept citing old numbers
      and silently named a different feature. The sixth was a stale predecessor work-folder path
      surviving into this document, including into a .gitignore instruction that would have
      excluded the wrong tree. Fixed as a class rather than as six lines, and that mattered --
      sweeping on the property found three occurrences the reviewers line list had not named.
      Cycle 2 confirmed all six Fixed and raised two new LOW findings, both in the blockquote the
      fix itself had added: a stated count of corrected citations that was wrong, and a claim that
      a script proves criterion ownership when no repository script does. Both fixed -- the count
      removed rather than corrected, because a stated count is what drifts and this documents
      predecessor got exactly that wrong six times in a row, and the ownership claim restated as
      what it is, verified by hand and by a tool that is not part of the repository. No cycle 3 was
      dispatched: the two remaining findings were single-sentence factual claims verifiable by
      grep, and both were re-measured directly rather than re-reviewed. The id-reuse hazard is
      recorded in section 11 rather than merely repaired, because it outlives the fix.

  - date: '2026-09-02'
    event: 'Apparatus portability -- Windows operator target'
    outcome: 'Fixed: 1 silent-wrong-measurement defect, 21 broken runbook commands'
    notes: >-
      The operator's machine is Windows, and the apparatus was POSIX-only in one way that would
      have produced a wrong number rather than an error. spike_probe.py used os.kill(pid, 0) for
      liveness. On POSIX that is the standard existence probe -- signal 0 is never delivered and
      only the existence and permission check runs. On Windows CPython has no signal concept: for
      any sig other than CTRL_C_EVENT/CTRL_BREAK_EVENT it opens the process and calls
      TerminateProcess(handle, sig), so os.kill(pid, 0) terminates the target with exit code 0.
      The probe would have killed the hook at its first sample, 250 ms in, and test 3 would have
      recorded KILLED(0.25) -- the observer killing the process it exists to observe, attributed
      to the host, and nothing downstream would have caught it because the shape is exactly what
      a real kill looks like. Liveness now dispatches on sys.platform: POSIX keeps signal 0,
      Windows uses OpenProcess + GetExitCodeProcess via ctypes with
      PROCESS_QUERY_LIMITED_INFORMATION so the probe can watch a host-spawned hook without
      elevation. The POSIX path was regression-checked and still yields the SURVIVED shape.
      spike_hook.py needed no change: it already resolves SIGHUP through getattr and skips it
      where absent. Separately, 21 runbook commands do not exist or behave differently on
      Windows; two of them fail quietly rather than loudly -- bare curl is an alias for
      Invoke-WebRequest in PowerShell 5.1, and inline VAR=value prefixes are not PowerShell
      syntax, so SPIKE_MACHINE would have stayed unset and every test 4 line would have carried
      the wrong machine label. The runbook is now PowerShell throughout (162 atomic steps, plus a
      Linux appendix for machine A), resolves the interpreter once as a recorded PY because
      Windows does not reliably provide python3, and states two Windows consequences before Part 0
      instead of leaving them to be discovered mid-run: test 3 resolves to +/-0.25 s from the last
      beat rather than exactly, and the record must carry that resolution plus
      'signal: none observable (Windows)'. The three spike_*.py files are force-added so they can
      be fetched onto the laptop; close-out step 159 git-rm's them and step 162 verifies none
      survive, keeping AC-20's no-carry-forward requirement checkable by search.
  - date: '2026-09-02'
    event: 'Feature 001 spike -- test 1 executed on machine A'
    outcome: 'Pass: Claude Code wakes. SURVIVED(30) + act. 4 findings recorded, 1 design-changing'
    notes: >-
      Run T1-000-a on Claude Code 2.1.258 / Windows 11 26200 / win32. The hook blocked 30.117 s
      against a 30 s deadline and returned under its own power; the stub had been asked to wait
      60 s so it could not have answered first, which is what makes the return the hook's own and
      not a stub artifact. Claude Code parsed the decision=block payload, surfaced its reason
      field, and the agent ran the named command, writing the act line 7.581 s after the wake was
      emitted. Wall and monotonic clocks agreed to 0.0003 s and no beat gap exceeded 0.258 s, so
      the machine did not suspend and the process was scheduled throughout. The probe never armed
      for this run -- three attempts expired before the hook started -- so there is no external
      liveness evidence, which is acceptable here because end proves the hook was not killed and
      act proves a turn ran, but is not acceptable for test 3 where KILLED and ABANDONED are
      otherwise indistinguishable. Four findings recorded in FINDINGS.md. F1 is design-changing
      and was not anticipated by the specification: the stop hook RE-FIRES 6.257 s after the
      woken turn, so waking is inherently a loop -- the wake ends a turn, ending a turn fires the
      stop hook, and the stop hook wakes the agent. Only the throwaway arming sentinel stopped a
      second block. Feature 003 must therefore carry an explicit re-entry rule; 'block on every
      stop event' is not implementable. F2: Claude Code runs hooks through bash on Windows, so a
      waker cannot assume native-shell quoting and must emit paths bash will not eat. F3: the
      instruction reaches the model labelled as a hook error, which is user-visible. F4: an
      interpreter on PATH may be a shim -- this machine's python is a pyenv-win python.bat -- so
      the waker must resolve the interpreter from the running process, never from PATH.
