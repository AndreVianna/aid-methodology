# [A] appended by aid-describe / aid-define as the interview and its
#     cross-reference pass proceed. Append-only, newest LAST. Distinct from
#     `lifecycle_history`, which records PHASE transitions and gates: this
#     records what happened INSIDE the interview -- a question round, a
#     stakeholder comment pass, a quality check, a cross-reference cycle.
#
#     Declared because the alternative is losing it. It lived under a
#     `### Review History` heading inside the legacy markdown `## Interview State`
#     section with no key of its own, which made it invisible to the schema and
#     mergeable into `interview.sections` by anything reading tables from that
#     range. A table the schema does not name is still data.
#
#   - date / event / outcome / notes
review_history:
  - date: 2026-09-04
    scope: delivery-004 gate (three cycles)
    outcome: >-
      PASSED at A+ on cycle 3. Nine tasks, 259 assertions across eight suites, zero regressions
      (159 suites, the same 15 pre-existing failures). Fourteen findings: thirteen fixed, one out of
      scope.
      TWO OF THIS DELIVERY'S CRITERIA NEED TWO MACHINES and are recorded as MP-09 and MP-10 rather
      than simulated. The automated suite runs two real hubs with a real TCP link, so every property
      of the PROTOCOL is genuinely tested; what it cannot do is meet a NAT or a stateful firewall, and
      the idle-link property is entirely about those. A test that closed the socket itself would prove
      the reconnect path works -- already covered -- and nothing about whether a 15-second keepalive
      suits real networks.
      Cycle 1 refused the delivery on the delivery's worst failure mode, and it failed SILENTLY: two
      hubs that nobody configured both took the identity 'local', which made every membership
      announcement look like the hub's own, so each side saw an empty channel and every send was
      refused as solo with nothing naming the cause. Fixed three ways -- hostname default, an explicit
      refusal on collision, and a manual procedure that sets and checks it.
      Then cycle 2 found that MY OWN FIX had a second copy of the logic it was fixing: link.mjs
      resolved the identity itself, so the hostname default never reached the wire and two documents
      claimed otherwise. The documentation was right about the intent; the second copy was wrong about
      the fact, which is what a second copy is for.
      SEVEN defects across the delivery were found by running two hubs rather than by reading, among
      them a link that was only half bidirectional and two namespaces sharing one column name.
    grade: A+

  - date: 2026-09-04
    scope: delivery-003 gate (three cycles)
    outcome: >-
      PASSED at A+ on cycle 3. Seven tasks, 217 assertions across seven suites, zero regressions
      (158 suites, the same 15 pre-existing failures). Nine findings: eight fixed, one out of scope.
      THREE of this delivery's criteria cannot be automated here and are recorded as manual
      procedures rather than quietly deferred: AC-1 needs two live host sessions, AC-24 needs a host
      that gates privileged actions by default, and AC-23's host half needs a stop hook that
      actually re-fires. A stub that never prompts proves nothing about a host that would. MP-05,
      MP-06 and MP-07 carry them with steps and pass conditions; the spike already ran all three.
      Cycle 1 REFUSED on the plainest kind of miss: `aid chat subscribe` was in bin/aid and entirely
      absent from bin/aid.ps1, and the parity test that would have caught it skips here for want of
      PowerShell. That gap had been recorded in task notes since delivery-001; this is the first time
      it hid a defect rather than merely an unverified line.
      TWICE, writing a test found a real defect. The read-before-wait fix went into the adapters and
      not the CLI subscriber, so `aid chat subscribe` would block past a message already in the
      store. And building the guard-timer test exposed the guard being applied PER REQUEST rather
      than per run -- 36 seconds against an 18 second budget, which is exactly the orphaned adapter
      the guard exists to prevent.
      One fix broke the node at startup (a temporal dead zone on the announcer handle) and the suite
      caught it at once, though the symptom -- eight unrelated assertions returning empty strings --
      looked nothing like the one-line cause in the node's log.
    grade: A+

  - date: 2026-09-04
    scope: delivery-002 gate (four cycles)
    outcome: >-
      PASSED at A+ on cycle 4. Four tasks, 158 assertions across seven suites, zero regressions
      (157 suites, the same 15 pre-existing failures). Eleven findings, ten fixed and one accepted
      (the unexecuted PowerShell twin, recorded as MP-03).
      Cycle 1 REFUSED on one HIGH, and the instructive part is which half was wrong: I collapsed
      unknown/stale/busy into one refusal token and justified it as denying an asker an enumeration
      oracle, then printed the distinction in `detail`. The reviewer caught the contradiction -- but
      the RATIONALE was the mistake, not the field, because the roster already lists every session
      by name to every caller. The comment now states the real reason and records that the first one
      was wrong, so a future reader does not reinstate the hiding believing it restores a property.
      The MEDIUM was worse in effect than in severity: the jittered retry hint was computed in the
      node and dropped by the CLI, so the livelock it prevents was still there for every agent using
      the surface agents actually use.
      Cycle 3 found that MY OWN FIX broke the no-work-ids-in-the-KB rule -- the anti-collision note
      named a work twice -- and that a second, older violation had survived three cycles. That rule
      binds every agent and nothing checked it, which is exactly why. There is now a guard
      (test-kb-no-work-ids.sh) that scans the whole KB for work ids and work-folder paths in prose,
      exempts command-syntax examples inside code spans, self-falsifies, and records its own known
      limits rather than implying completeness.
    grade: A+

  - date: 2026-09-04
    scope: delivery-001 gate (four cycles)
    outcome: >-
      PASSED at A+ on cycle 4. Eleven tasks, 109 assertions across five canonical suites,
      zero regressions against the pre-work baseline (verified in a clean worktree at the
      commit before the delivery began, not by stashing). Seventeen findings across four
      cycles, all fixed. Cycle 1 REFUSED the delivery on two HIGHs, and both were the same
      species: code that was correct but unreachable (reapSession had no route or verb, so
      AC-30's reap clause could not be exercised through the product) and a criterion that
      skipped rather than ran (AC-22's PATH-stripping removed only the first directory
      containing node, and this machine has two). Two of cycle 3's findings were introduced
      by cycle 2's own fixes -- a vacuous assertion left pointing at the wrong node, and a
      flag added without a test -- which is the argument for re-gating after fixing.
      Writing the last test (CO23) corrected an understanding rather than confirming one:
      the too-late discard occurs only once a reader has ACKNOWLEDGED past a grace skip, so
      the loss window is narrower than first documented, and both the test and core.mjs now
      state the narrower condition.
    grade: A+

  - date: '2026-09-01'
    event: 'Seeded from a predecessor'
    outcome: 'seven sections Complete, three Pending'
    notes: 'Sections 1-3, 5, 6, 9 and 10 carried; 4, 7 and 8 carried but left open for this interview. Section 9 renumbered to a gapless AC-1..AC-22.'
  - date: '2026-09-01'
    event: 'Interview turn 1 -- pre-reset residue swept as a class'
    outcome: '10 edits across 1, 4 and Feature 003; section 1 reopened'
    notes: 'The deleted deploy verb was still live text in eight places, contradicting FR-1.1 and FR-7.6. Sweeping the class rather than the eight lines found four further pre-reset assertions in Feature 003 that the deploy hits had not pointed at: the node as a separate package aid does not contain, Python as its prerequisite, an open question about where deploy fetches the node (which section 8 already records as closed by deletion, with the opposite premise), and the withdrawn MCP facade treated as shipping. Section 1 moved Complete -> Pending: it carried the defect while marked Complete and exempt from sweeping as runtime-independent, so its clean bill was unverified rather than earned.'
  - date: '2026-09-01'
    event: 'Interview turn 2 -- discovery promise bounded'
    outcome: '6 edits across 4, 10 and Feature 009; contradiction closed'
    notes: 'Zero-configuration discovery was promised in Feature 009s Description, user story and scenario, while AC-4 -- the criterion that feature owns -- requires only a path depending on no network feature, and section 10 stated in writing that shipping the floor would leave the promise unmet with the criterion green. Stakeholder decision: best-effort, not a v1 promise. A criterion for it was considered and rejected on AC-4s own reasoning -- it would be environment-dependent by construction and red on an ordinary laptop (WSL2 multicast, AP client isolation, macOS 15+). The scenario is split so the guaranteed path is tested and the zero-configuration layer is marked best-effort and criterion-free.'
  - date: '2026-09-01'
    event: 'Interview turn 3 -- the node Node floor declared'
    outcome: '3 edits across FR-7.7 and section 8; one coupled question left open'
    notes: 'Section 8 deferred the number to /aid-specify while already carrying the evidence that determines it: node:sqlite does not exist before 22.5.0 and needs a flag until 22.13.0, so the repository floor of >=22 admits five releases on which the node cannot open its own store. Stakeholder decision: declare >=22.13.0 now, in FR-7.7 and section 8. Low, and determined rather than chosen -- the lowest floor that works rather than the lowest available. Deferring invited a later reader to inherit >=22 from the adoption argument alone, which is the M5 pattern (a declared floor nothing demonstrates) arriving from the other direction. Still open and deliberately not settled: the ExperimentalWarning the module emits on stderr on 22.x and 23.x, and whether an operator-started service may print it.'
  - date: '2026-09-01'
    event: 'Interview turn 4 -- the experimental warning is suppressed, narrowly'
    outcome: '3 edits; FR-7.7 gains a requirement, Feature 003 a scenario'
    notes: 'Below Node 24.15.0 the built-in SQLite module prints an ExperimentalWarning to stderr on every open -- observed first-hand on v22.14.0 -- so on the floor just declared every start would carry a line the operator cannot act on. Stakeholder decision: suppress it. Scoped deliberately to that one message on that one runtime range, never warnings wholesale, so a different experimental warning still surfaces on a module at release-candidate status. The reasoning is FR-7.7s own actionable-error principle applied to success rather than failure: the nodes stderr is where AC-22s prerequisite error must land, and a line on every start is what teaches an operator to stop reading it. No section-9 criterion was added -- the behaviour is verified as a Feature 003 scenario, because section 9 was just renumbered gapless and appending to it should be deliberate rather than a side effect. The filter expires by construction once the declared floor reaches 24.15.0.'
  - date: '2026-09-01'
    event: 'Interview turn 5 -- scope-reset prehistory stripped from sections 1-10'
    outcome: '11 edits; sections 1, 7 and 8 closed, 4 still open'
    notes: 'A requirements document states what is true now and why, not how it came to say that -- git holds the latter. Removed: dated reset markers, previously-X framing, and reversal narratives, across section 1, section 4s facade bullet, FR-6.1, FR-7.6, the FR-8 note, section 7s agent-surface bullet, section 8s toolchain line and closed-by-deletion paragraph, and section 10s adjacency note. Kept, restated in the present tense where needed: every live rationale, including why a skill beats an MCP facade and the one thing that choice gives up. Three things deliberately not stripped -- FR-1.1s open start-idempotence sub-decision, the ID-9/12/13 override annotations (a conclusion copied without its override reinstates a rejected design), and the PyPI premise itself, which is the next open question. Section 4 stays Pending because it carries that premise.'
  - date: '2026-09-01'
    event: 'COMPLETION -- quality check and KB hydration'
    outcome: 'quality check clean with one noted caveat; 1 KB doc hydrated'
    notes: 'Quality check: every feature owns at least one criterion; all 22 criteria name an observable; sections 4 and 5 consistent across the six in-scope items checked; the three reset classes swept in earlier turns are clean. One caveat recorded rather than fixed -- AC-9s second half ("running the command again is safe") is falsifiable only as far as "does not fail destructively" until FR-1.1s open start-idempotence sub-decision lands, which the document already flags. KB hydration: external-sources.md gains the node:sqlite entry -- vendor version history (added 22.5.0 flagged, unflagged 22.13.0, release candidate 24.15.0) plus the first-hand store-contract measurements on v22.14.0, v24.19.0 and v26.7.0, with method and dates. Both are durable facts about a third-party runtime, the same class as the host harness docs already there, and expensive to re-derive. Nothing forward-looking was written: the node does not exist, so no technology-stack or architecture content is true yet.'
  - date: '2026-09-02'
    event: 'Approval gate'
    outcome: 'Approved'
    notes: 'Stakeholder approved the assembled requirements after a whole-picture read-back. Ten sections Complete, 22 criteria each owned by exactly one feature, 40 functional sub-requirements each mapped. Five interview turns, five decisions: the pre-reset deploy/install residue swept as a class (which reopened section 1, since it had carried the defect while marked Complete and exempt from sweeping); zero-configuration discovery bounded to best-effort rather than promised; the nodes Node floor declared >=22.13.0, determined by the store rather than chosen; node:sqlites experimental warning suppressed narrowly; and the scope-reset prehistory stripped from sections 1-10. Q1 answered: FR-8s withdrawal now stands on a reason independent of the PyPI channel decision, which is labelled an input rather than asserted as fact. One assumption re-confirmed at the gate and left standing on that footing. Next: /aid-define work-001.'
  - date: '2026-09-02'
    event: 'Feature Decomposition -- 11 features re-decomposed into 5'
    outcome: '5 features, one per section-10 stage; all 95 scenarios carried'
    notes: >-
      Stakeholder directive: the minimum number of features, one if possible, with maximum
      cohesion. One is unreachable -- AC-20 requires that no code from the spike be carried
      forward, which is a statement about a boundary and means nothing without one. Two is
      unreachable for a different reason -- /aid-plan sequences features into deliveries, so a
      single product feature yields one delivery and section 10s requirement that each stage
      from P1 leaves working product behind would exist only as prose. Five, one per stage, is
      the floor, and it is also where cohesion falls because the stages were drawn around what
      ships together. The load-bearing merge is Feature 002, which collapses the three features
      an earlier decomposition had split: that split had failed on its own terms, one feature
      owning the store schema another needed, so a schema defect in the first blocked the second
      outright. Content was carried rather than retyped -- all 95 verification scenarios, every
      Description and every user story survive the boundary change, and Feature 001s A+
      specification is unchanged because its boundary is. Verified: 22 criteria owned exactly
      once, 40 requirements mapped, section 10 and section 11 agreeing stage for stage.
      Feature 005 is recorded as the weakest cohesion of the five rather than presented as clean.
  - date: '2026-09-02'
    event: 'Feature 001 apparatus built and smoke-tested (out of phase, deliberately)'
