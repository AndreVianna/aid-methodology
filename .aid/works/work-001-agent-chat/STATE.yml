      state: Complete
      updated: '2026-09-01'
    - id: 4
      name: Scope
      state: Complete
      updated: '2026-09-03'
    - id: 5
      name: 'Functional Requirements'
      state: Complete
      updated: '2026-09-03'
    - id: 6
      name: 'Non-Functional Requirements'
      state: Complete
      updated: '2026-09-03'
    - id: 7
      name: Constraints
      state: Complete
      updated: '2026-09-01'
    - id: 8
      name: 'Assumptions & Dependencies'
      state: Complete
      updated: '2026-09-01'
    - id: 9
      name: 'Acceptance Criteria'
      state: Complete
      updated: '2026-09-03'
    - id: 10
      name: Priority
      state: Complete
      updated: '2026-09-03'

# [A] one entry per feature, in id order. Created by aid-define at feature
#     decomposition (one entry per `### Feature NNN` section it appends to
#     REQUIREMENTS.md § 11) and updated by aid-specify as each feature
#     advances. Present on BOTH layouts -- a feature is a work-level concept,
#     so this key is never omitted for a full multi-delivery work.
#
#     A feature is a SECTION, not a folder: `id` identifies
#     `REQUIREMENTS.md § 11 ### Feature NNN`, and there is no
#     features/feature-NNN/ directory and no per-feature SPEC.md to point at.
#     Ids are never reused or renumbered -- a withdrawn feature keeps its
#     entry with `withdrawn: true` so that every citation of it still
#     resolves, and the number is not handed to a later feature.
#
#     `state` and `grade` describe that section's `#### Technical
#     Specification` -- the part aid-specify fills. `sections` is the
#     per-technical-section progress aid-specify tracks while it works
#     through The Loop; it is the declared home for that tracking and is
#     legitimately empty until aid-specify has run.
#
#   id:       '001'.. -- quoted, so a leading zero survives the YAML read
#   name:     short slug; the §11 section title is authoritative
#   state:    Pending | In Discussion | Spike Needed | Blocked | Ready
#   grade:    {grade} | Pending
#   qa_count: integer
#   withdrawn: true -- omit the key entirely for a live feature
#   sections[].state: Pending | In Discussion | Complete
