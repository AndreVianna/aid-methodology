      it corrects a premise the specification and the apparatus shared: the question 'how long may a
      stop hook block' is two questions. How long the host lets a hook BLOCK measures at >= 120 s
      with no upper bound found; how long it stays willing to ACT afterwards falls somewhere in
      (60, 120]. A design reading only the first number would conclude a 120 s long-poll is safe
      when it is not -- the hook returns, the message is in hand, and nothing happens, which from
      inside the product is indistinguishable from no message having arrived. Section 6's 30 s
      long-poll default sits inside the region where both limits hold, so the default is not in
      question; what is now excluded is treating the long-poll as freely tunable upward on the
      strength of the blocking limit alone. Left open and NOT answered by this run: whether Cursor
      read the decision=block payload and declined it, or had already stopped listening to the
      hook's stdout. Same observable, different mitigations -- a policy to work within versus a
      deadline to stay inside -- and distinguishing them needs host-side instrumentation the spike
      does not have. Bracket is now S=60 F=120 with tolerance max(5, 0.10*120)=12 s; F-S=60 exceeds
      it, so the ladder stops climbing, the 300 and 600 rungs are moot, and bisection begins at
