    outcome: 'ABANDONED(120). F7 filed: block-tolerance and act-willingness are distinct limits. S=60 F=120'
    notes: >-
      Run T3-120-a blocked the full 120.097 s with socket elapsed 120.068 s, kind=timeout,
      elapsed/D 1.0006, drift 0.0017 s, and the probe holding alive=true throughout before going
      false 0.158 s after end. So Cursor did NOT kill it. But no refire was written and the operator
