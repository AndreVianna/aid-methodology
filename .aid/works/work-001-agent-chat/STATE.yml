  - date: '2026-09-02'
    event: 'Feature 001 spike -- F7 corrected: the boundary was a configured hook timeout, not a host limit'
    outcome: 'Corrected. Real finding: Cursor abandons a timed-out hook without killing it. Bisection cancelled'
    notes: >-
      The operator supplied the actual hook registration, which carries "timeout": 90 alongside the
      command. That explains every run under a single rule -- the wake is honoured if and only if D
      is less than timeout -- with D=30, 60 and 60 all under it and honoured, and D=120 over it and
      not. No unexplained host policy is needed, and ABANDONED(120) is D exceeding a configured
      value rather than a discovered limit. The bisection between 60 and 120 is CANCELLED: it would
      have spent runs rediscovering a number already written in the config file, and the 300 and 600
      rungs are moot for the same reason. The correction matters because the earlier write-up
      inferred two independent limits, block-tolerance at >=120 s versus act-willingness somewhere in
      (60, 120]. The first half stands and is confirmed: Cursor genuinely does not kill a long hook.
      The second was an artefact of reading a configured 90 s as a discovered boundary. What replaces
      it is sharper and was already in the data: Cursor's timeout fired around 90 s into T3-120-a,
      yet the probe recorded alive=true until 120.097 s, dying only 0.158 s after the hook wrote its
      own end -- so the process outlived Cursor's abandonment by about 30 s. On timeout Cursor
      discards the hook's output and stops waiting but LEAVES THE PROCESS RUNNING. Three consequences
      for Feature 003: every wake attempt outlasting timeout orphans a process, which on a poll cycle
      is a leak nothing in the host reports; the orphan still holds its long-poll socket, so a node
      counting connected waiters over-counts; and the waker must keep its block strictly under the
      host's configured timeout, a value it cannot discover by observation because it is per-hook
      configuration rather than a host constant. Two questions remain open and were put to the
      operator: whether Cursor enforces a maximum acceptable timeout, which would bound how long a
      waker may ever block on this host, and whether 90 was Cursor's own default or a value chosen at
      registration, which decides whether the product must assume 90 s in the field.
    applied_to: 'FINDINGS.md (F7 rewritten, test 3 answer, ladder framing)'
  - date: '2026-09-02'
    event: 'Feature 001 spike -- Cursor hooks documentation read; F8 and F9 filed; wrong wake schema corrected'
    outcome: 'Docs state NO numeric timeout default. F8: wrong mechanism used, and loop_count solves F1. F9: F5 gate is closable'
    notes: >-
      Cursor's own hooks documentation was consulted to answer whether a default hook timeout is
      specified. It is not: the option table gives timeout as 'platform default' with no number, at
      both places it appears. A third-party reimplementation of the hook runner hard-codes 30 s and
      labels it Cursor's platform default, but that is an inference rather than a vendor statement
      and says nothing about this build. With the operator's timeout line now removed, the default is
      measurable: a run at D=60 separates a 30 s default (ABANDONED) from anything at or above 60 s
      (SURVIVED), which is worth more than further doc reading. Two further documented facts changed
      the record. F8: Cursor's stop hook contract is input {status, loop_count} and output
      {followup_message}, and decision=block is Claude Code's convention that does not appear in
      Cursor's schema at all. The spike sent the Claude shape to both hosts, so the ACKs at D=30 and
      D=60 are NOT evidence that Cursor honours decision=block -- something carried the text to the
      model, most likely unrecognised hook output surfacing as an error string the model then read,
      but the supported mechanism was never exercised. Test 2's claim that Cursor honours the same
      convention as Claude Code is withdrawn; what stands is that a wake occurred, not how. The input
      side matters more: loop_count reports how many automatic follow-ups a conversation has already
      triggered and loop_limit caps them, default 5 on Cursor and null (UNCAPPED) on Claude Code. That
      is F1's re-entry rule, already built and documented, so Feature 003 reads loop_count rather than
      inventing a sentinel -- and F1 is sharpened rather than retired, because Claude Code's uncapped
      default means the loop observed there has no host-side backstop. F9: beforeShellExecution
      returns {permission: allow|deny|ask}, so a hook can pre-authorise the exact command a woken turn
      runs, which closes the approval gate that voided T2-001-a's latency. That does not retract F5 --
      the gate is real and a product cannot assume users installed such a hook -- but it makes the
      constraint closable by configuration, which is the difference between 'the woken turn may not
      use tools' and 'may use tools the operator pre-authorised', and those imply different install
      instructions. Also recorded: hook failures including timeout are fail-open by default, and a
      waker must never set failClosed true because a hung long-poll would then freeze the agent.
      Apparatus updated: --wake-schema cursor emits followup_message, and the hook now reads the
      host's stdin payload and logs status, loop_count and the key set actually received, so a run
      records what it was given rather than what it assumed. All four schemas verified.
    applied_to: 'FINDINGS.md (F8, F9, F7 default paragraph, test 2 claim withdrawn); throwaway/spike_hook.py'
