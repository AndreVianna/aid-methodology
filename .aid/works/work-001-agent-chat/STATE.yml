  - id: 2
    category: Architecture
    impact: Required
    state: Answered
    context: >-
      The spike found that Cursor hands its stop hook an undocumented conversation_id (F10),
      which is exactly the per-conversation identity Feature 002 needs and had assumed it would
      have to invent. FR-2.4 was written from that finding to mint the product's own id and treat
      the host's as correlation metadata only, but a requirement written FROM a finding is not the
      same as a decision taken, and this one has a real cost: FR-2.2 lets a name be re-registered
      and reattaches the session to its existing memberships and unread positions, which a
      product-minted id cannot distinguish from a different conversation reusing the same name,
      while a host-supplied id could. So the fork was left explicit and unratified rather than
      settled quietly by the agent.
    suggested: >-
      Ratify FR-2.4 as written -- mint the product's own id, carry the host's alongside as
      correlation metadata, key nothing on it -- and treat stale reattachment as a specification
      problem for Feature 002 to solve without the host's id, so that the behaviour is correct on
      all five hosts rather than only on the one that supplies a field.
    answer: >-
      Ratified, and the stakeholder supplied the governing reason, which is stronger than the one
      the requirement had: the product must control the id's IMMUTABILITY, and it cannot control
      that for a value another program owns and may re-issue, re-scope or reuse on its own
      schedule. Reach -- one host in five, undocumented -- reinforces the decision but no longer
      carries it. FR-2.4 now leads with immutability; the reach argument is demoted to support.
      Consequence carried into Feature 002 unchanged: stale reattachment must be solved without a
      host-supplied id.
    applied_to: 'Section 5 FR-2.4; section 11 Feature 002 identity note'
  - id: 3
    category: Architecture
    impact: High
    state: Answered
    context: >-
      Raised by the stakeholder during an architecture review: who decides which machine is a
      chat's home? Nothing in the document says. It falls out of WHERE the operator ran chat
      create -- create is CLI-only and acts on the local node, so the chat is born there and
      FR-3.3's "the machine in its id" is that machine. There is no --home parameter and no
      placement step. Three consequences are unspecified: whether a chat may be created homed on
      ANOTHER machine (FR-3.2 makes lookup local-only but says nothing about create); whether a
      chat can be re-homed later (today only delete-and-recreate, which loses the log); and that
      the operator is making a durable placement decision without being told, since the home
      machine is whose disk holds the log, whose uptime gates reads, and whose retention policy
      governs the chat. It is the same single point of failure as the offline-home read gap.
    suggested: >-
      For v1 state it out loud in FR-3.3 -- create is local-only, home is where you created it, no
      remote create, no re-homing -- and let aid-specify decide whether reads degrade or fail when
      the home machine is away. The stakeholder then proposed a stronger alternative: drop the
      per-chat home entirely, give every machine its own node, and let nodes replicate and route
      among themselves so a session only ever knows its local node. Half of that is already the
      design (sessions subscribe locally; FR-6 puts the LAN hop between nodes, confirmed by F11).
      The genuine change is removing the single authoritative owner per chat, which buys
      availability and costs the two guarantees section 6 already promises: FIFO within a chat
      (the home is the sequencer) and the global trim condition "read by every live member". A
      middle option is on the table -- keep the home as sequencer and writer, add a local
      read-replica on every participating node -- which fixes offline reads without giving up
      order. THE STAKEHOLDER THEN RELAXED THE PREMISE: message ordering is not a hard requirement,
      and the model to design to is a walkie-talkie -- each machine has its own device, chats are
      channels, and each speaker frames its own transmission with a start and an end. That makes
      the fully replicated shape cheap, because per-speaker FIFO needs no sequencer, and it
      simplifies two further things rather than complicating them: retention becomes LOCAL (each
      node trims its own replica against its own members' positions, so the cross-node position
      gossip disappears) and a channel becomes a name rather than an owned object (which retires
      FR-3.2's machine-qualified chat id and its local-only resolution rule). Costs identified:
      cross-speaker causality is no longer positional in chats of three or more, so a causal link
      must be carried in-band by FR-4.6's reply_to/correlation_id; and the overflow and
      unread-depth bounds become local-knowledge-only. One question it forces, still open: whether
      a channel needs creating at all -- a radio frequency exists whether or not anyone is on it,
      which collides with FR-3.4's no-implicit-create and AC-21's operator-creates-a-chat.
      Half-duplex (one speaker holds the channel) is ruled OUT rather than open: it would restore a
      total order but only by blocking a sender, and FR-4.7 forbids any blocking operation.
      Unresolved pending the stakeholder's choice.
    answer: >-
      RESOLVED as the walkie-talkie model, with the per-chat home retired outright. A channel is one
      name on every hub, replicated to each hub with a member in it, authoritative nowhere (FR-3.2,
      ID-16); ordering relaxes to per-speaker FIFO with causality carried in-band by reply_to
      (section 6, ID-15, AC-31); and retention becomes LOCAL to each hub, trimming against its own
      members' acknowledged positions, which deletes cross-hub position gossip from the design. The
      stakeholder's own question -- who decides the home -- stops having an answer because it stops
      being a question. One rule was added to make the replicated model decidable without consensus:
      a member JOINS AT THE CHANNEL'S CURRENT HEAD and receives no history from before (FR-4.2), so a
      hub acquiring a channel starts an empty replica, there is no backfill and no source hub to
      choose, and two hubs' differing trim points cannot produce two different pasts.
    applied_to: 'Sections 1, 4, 5 (FR-3.2, FR-3.3, FR-4.2, FR-6.3), 6, 7 (ID-15, ID-16), 9 (AC-5, AC-11, AC-19 retired, AC-31), 10, 11 (Features 002, 004)'
  - id: 4
    category: Architecture
    impact: High
    state: Answered
    context: >-
      Stakeholder-proposed bound on the walkie-talkie channel model (qa 3): an agent is connected to
      at most ONE channel at a time and must leave its current channel to join another; it may create
      one channel; a channel closes when the last agent leaves OR after an inactivity timeout
      (proposed 1 hour), with a notification to any agent still connected; and a channel does NOT
      close merely because its creator left. This collapses real machinery -- one position per
      session rather than one per session-per-chat (FR-4.2), no cross-channel branch in inbox
      (FR-4.3), an implicit quota, and automatic lifecycle that retires operator create/delete
      (FR-7.2, AC-21). Rule 2 is redundant with rule 1: "connected to one at a time" already bounds
      creation, since creating is create-and-join.
    suggested: >-
      Accept the one-channel bound; fix three things before it is written into the requirements.
      (1) THE 1-HOUR INACTIVITY TIMER FIGHTS THE PRODUCT'S PURPOSE. Idle waiting is the normal
      state; two agents each waiting on the other are "inactive" by definition, so the channel would
      be destroyed underneath exactly the scenario this product exists for. Close on
      last-member-out only, counting a member as out once REAPED, and reuse FR-2.3's existing
      thresholds (stale 30 min, reap 24 h) instead of adding a channel-level timer. (2) A CRASH MUST
      NOT COUNT AS A LEAVE. If a dropped connection empties the channel, a network blip or a host
      restart garbage-collects the conversation and destroys its log, and AC-3 -- a session
      restarting mid-flight receives its undelivered messages on reattaching -- fails. Explicit
      leave means gone; a dropped connection means stale, then reaped. (3) THE ONE-CHANNEL BOUND
      KILLS THE ALL-CALL BROADCAST CHANNEL agreed one turn earlier, since a session cannot be in
      both its channel and the all-call. Pick one: drop broadcast, model it as a node-level notice
      outside the channel model, or allow the all-call as the single explicit exception. Also to be
      accepted knowingly: channels become EPHEMERAL -- the last member out destroys the history and
      a conversation cannot be resumed tomorrow -- which is walkie-talkie-consistent but contradicts
      FR-4.2's durable-log language, so that language must be restated rather than left standing
      beside it.
    answer: >-
      FULLY DECIDED. Originally partly decided with one sub-question open, now closed at the end. DECIDED: (a) a crash is not a leave -- a dropped
      connection means stale, then reaped -- so the channel-close rule keys on explicit leave plus
      reaping, and AC-3's mid-flight reattachment survives. (b) The 1-hour CHANNEL inactivity timer
      is dropped; a channel with live members waiting on each other must never expire, and cleanup
      rides on FR-2.3's existing member thresholds instead. (c) The all-call broadcast channel is
      removed for now, which also removes broadcast-to-all-agents as a feature and reopens
      rendezvous (see qa 6). STILL OPEN: what, if anything, bounds an ETERNALLY IDLE but live
      session. Accounting offered -- the log is bounded by the 24 h TTL, the held connection and
      hook process by FR-5.8's no-orphan rule, the name by reaping -- leaving only the channel's
      continued existence, which is a directory row. The product cannot distinguish a session
      waiting legitimately from one that will never receive anything, so the options are: v1 adds
      nothing and leans on reaping plus FR-7.1/FR-7.2 operator visibility and eviction; or the node
      PROBES on idle, waking the session after a generous configurable period to ask whether it is
      still waiting, resetting on an answer and reaping on silence. Either way the timer belongs on
      the session, never on the channel. THAT SUB-QUESTION IS NOW CLOSED as ID-22: v1 adds nothing.
      The product cannot distinguish a session legitimately waiting hours for a peer's long task from
      one that will never receive anything, and only the human can, so reaping removes the dead and
      FR-7.1's visibility plus FR-7.2's eviction cover the rest. Probe-on-idle is recorded in ID-22
      as the named growth path rather than adopted. Section 6 also states the accounting that makes this
      defensible: the log is bounded by the TTL, the held connection and hook process by FR-5.8's
      no-orphan rule, the name by reaping, leaving only the channel's existence, which costs a row.
    applied_to: 'Sections 4, 5 (FR-2.3, FR-3.3, FR-3.4, FR-3.8, FR-9.3, FR-9.6), 6 (Limits, and the idle-session paragraph), 7 (ID-17, ID-18, ID-22), 9 (AC-3, AC-29, AC-30), 11'
  - id: 5
    category: Architecture
    impact: Medium
    state: Answered
    context: >-
      In the walkie-talkie model the stakeholder described messages directed "to an individual id".
      That reads two ways, and they are not equivalent: a whisper INSIDE a channel, which FR-3.6
      already provides, or a direct session-to-session address that needs no channel. The second
      would reverse FR-3's core rule -- the chat is the only addressing unit, and a session name is
      "an identity, not an address ... never a destination on its own" (FR-2.1) -- and would add a
      second address space alongside channels.
    suggested: >-
      Keep whisper; add no second address space. Three visibility modes on one addressing unit
      (ordinary to all, mention flagged but visible to all, whisper visible to one) cover the need
      without a parallel routing rule.
    answer: >-
      Confirmed by the stakeholder: "individual id" means WHISPER INSIDE A CHANNEL. No direct
      session-to-session address is added, the channel remains the only addressing unit, and FR-3.6
      stands as written. No requirement change follows -- this entry records the alternative that was
      considered and rejected, so a later reader does not reopen it.
    applied_to: 'No change; FR-3.6 and FR-2.1 stand as written'
  - id: 6
    category: Architecture
    impact: High
    state: Answered
    context: >-
      Removing the all-call channel (qa 4) reopens a structural gap the one-channel bound created:
      how do two agents that share no channel ever meet? A wake only reaches members of a channel
      the recipient is in, so an agent in no shared channel cannot be notified at all -- to talk you
      need a shared channel, and to agree on one you need to talk. The all-call was the zero-new-
      mechanism answer, being a channel everyone monitors, exactly as maritime VHF hails on channel
      16 and then moves to a working channel. It is now gone. Note also that joining needs no
      PERMISSION mechanism: there is no authentication anywhere (section 4; FR-6.2 makes network
      membership the whole condition for taking part), so a join gate would be advisory only, in the
      same way FR-7.3 concedes the privilege boundary is not a sandbox. What is missing is
      notification, not authorisation.
    suggested: >-
      For v1, human-mediated rendezvous: the operator names the channel to both agents, which is
      realistic for a developer running two assistants on a trusted LAN, needs no new mechanism, and
      keeps FR-3.1's channel listing as the discovery surface for an agent that is already awake.
      The growth path, if automatic rendezvous is wanted later, is invitations as CONTROL PLANE
      rather than messages -- invite(name, channel) routed node-to-node and held as pending state on
      the target's node, surfaced when its hook next fires. That costs a second delivery path,
      because the wake payload stops being just a message, which is why it is not the v1 choice.
      STAKEHOLDER PROPOSAL, better than either option above: an agent connects to the HUB (the node)
      on register, independently of any channel. At hub level it can see which agents are available
      and send a DIRECTED connect request to one named agent to open a channel -- several requests
      for several agents, never a broadcast -- and hubs federate to hubs so the request crosses
      machines. This solves rendezvous with no all-call and no pending-invitation store. It reconciles
      with qa 5 by introducing TWO PLANES: a control plane at the hub (register, roster,
      connect-request) and a message plane in the channel (send, inbox, ack, whisper, mention). The
      channel remains the only addressing unit FOR MESSAGES; a connect request is signalling, not a
      message, so no direct session-to-session MESSAGE address is added. Most of it is free: the
      roster is derivable from state that already exists (registration plus FR-2.3 liveness plus
      whether the agent is in a channel), hub-to-hub is FR-6 as written, and one long-poll serves
      both event kinds. Recommended refinement, driven by the spike's F5: NO ACCEPT STEP. An explicit
      accept would be a tool call, which Cursor gates behind a human click, so the hub answers from
      state instead -- target idle, it is joined immediately and its wake says so; target already in
      a channel, the request fails instantly as busy. The one-channel bound becomes the arbiter,
      which removes pending state, timeouts and an invitation store altogether. Costs: the wake
      payload carries two event kinds, the agent-facing surface grows two verbs, and FR-7.3 with
      AC-15 change shape. Note also that a federated roster exposes session names, tool and liveness
      to every agent on the LAN, which is consistent with FR-6.2 but is the same exposure the
      all-call would have had.
    answer: >-
      RESOLVED by the stakeholder's hub-plane proposal, which is better than either option recorded
      above and needs neither an all-call nor a pending-invitation store. FR-9.1 to FR-9.7: a session
      joins the hub on register independently of any channel and stays reachable there; FR-9.2's
      roster shows who is available; FR-9.3's connect request names ONE agent and the hub answers it
      FROM STATE with no accept step -- available target joined, busy or stale or unknown target
      failed at once. The no-accept rule is driven by measurement rather than taste: an accept is a
      call the woken session makes, and the spike's F5 found a host that gates such a call behind a
      human click, which FR-5.7 forbids assuming. Three further rules closed holes review found in
      the proposal: an asker must already be in the channel it names and may not name itself
      (FR-9.3); a connect outcome is DURABLE PER-SESSION STATE rather than an event, so being placed
      in a channel IS the notification and nothing can be missed between arms (FR-9.5); and a relayed
      request never fails for want of recognising a channel name -- the target's hub creates its
      replica and joins, accepting the race where the asker already left (FR-9.7). Human-mediated
      rendezvous is recorded as the rejected alternative in ID-19, with the all-call and pending
      invitations.
    applied_to: 'Sections 1, 4, 5 (FR-0.2, FR-9.1-9.7, FR-7.3), 7 (ID-19), 9 (AC-27, AC-28, AC-33), 10 stage P1, 11 (Features 002, 003, 004)'
