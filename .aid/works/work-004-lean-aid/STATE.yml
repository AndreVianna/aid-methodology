# Work State -- work-NNN-{name}
#
# This is the WORK-LEVEL STATE.yml template. It is divided into three zones:
#   FRONTMATTER (single-writer, machine-parsed scalars) -- top-level keys,
#     verbatim: pipeline identity, work-level lifecycle/phase/approval
#     scalars, and (for flattened single-delivery works only) the delivery
#     lifecycle/gate scalars. Written ONLY by `writeback-state.sh` (surgical
#     single-key write; every other line is reproduced byte-for-byte).
#   AUTHORED (single-writer, YAML structures under a key, one key per former
#     markdown section) -- interview, features, lifecycle_history, deploy,
#     delivery_lifecycle (incl. its tasks_lifecycle child), delivery_gate, qa.
#   DERIVED (read-only, assembled at read time) -- Plan/Deliveries, Tasks
#     State, Delivery Gates, Calibration Log, Dispatches. NOT represented
#     here -- no key at all. A reader seeing no key derives the same union it
#     derives today. Agents that write state must target the per-unit
#     STATE.yml files instead. `qa` is the one former-DERIVED name that keeps
#     a key here, because on the flattened Lite path it is AUTHORED.
#
#     `features` was ALSO listed as DERIVED here and that was wrong. Nothing
#     derives it: /aid-define creates a row per feature at decomposition and
#     /aid-specify updates that row as the feature advances, so it is
#     AUTHORED like `interview`. The mislabel was not merely a documentation
#     defect -- it made the STATE.md -> STATE.yml converter treat a real
#     Features State row as proof that a work still needed the pre-hierarchy
#     era migration, so it REFUSED to convert any work that had been through
#     /aid-define, and named a remedy that cannot run on a work with no
#     tasks/. Declaring the key is what closes that.
#
# Writer legend -- stated in full-line comments above each key, NEVER as a
# trailing comment on the key itself (D-3):
#   [W] writeback-state.sh is the sole writer (surgical single-key write)
#   [A] authored by this work's active branch (single writer)
#
# This is the single state file for THIS work -- the full dev lifecycle from
# req to spec to plan to impl to deploy. One STATE.yml per
# .aid/works/work-NNN-{name}/ directory. See also: per-delivery
# delivery-NNN/STATE.yml (delivery lifecycle + gate + delivery-scoped Q&A +
# derived task rollup) and per-task delivery-NNN/tasks/task-NNN/STATE.yml
# (mutable task cells).
#
# Artifact files (REQUIREMENTS.md, PLAN.md, per-task DETAIL.md) carry NO inline
# "## Change Log" section. Content history -- what changed in the document -- is
# exactly what git records, with author, date and full diff, and without drift;
# a hand-maintained table duplicates it at lower fidelity. This is the same
# reasoning the tracking-discipline rule already applies to .aid/knowledge/ docs,
# extended to work artifacts. Process state (where are we in the workflow) is
# what THIS file is for, and it stays here.
#
# The AUTHORED delivery_lifecycle / tasks_lifecycle / delivery_gate keys
# (singular) apply ONLY to single-delivery flattened works (no
# deliveries/delivery-NNN/ wrapper). They are promoted verbatim from
# delivery-state-template.yml / task-state-template.yml and are distinct from
# the plural DERIVED Delivery Gates / Plan-Deliveries / Tasks State union
# views, which are omitted here entirely. Left absent (keys omitted) for full
# multi-delivery works, where each delivery's own lifecycle/gate lives in its
# delivery-NNN/STATE.yml and each task's own state lives in its
# delivery-NNN/tasks/task-NNN/STATE.yml instead.
#
# Full-layout omission rule: a full multi-delivery work's STATE.yml is
# IDENTICAL to this template minus these keys: delivery_state, gate_tier,
# gate_grade, gate_timestamp (the four flattened-only gate/delivery scalars),
# minus delivery_lifecycle, tasks_lifecycle, delivery_gate (each lives in its
# own delivery/task file instead), and minus qa (DERIVED on the full path).
# `features` is NOT on that list: a feature is a work-level concept on both
# layouts, so the key is present either way.
#
# Optional `ticket_ref` scalar (top-level, both layouts): links this work to
# an external tracker item ({connector-stem}:{external-id}, e.g.
# jira:PROJ-123). Left `--` when this work is not linked; readers/dashboard
# ignore it. Nearest-ancestor resolution + MCP-first consumption contract:
# canonical/aid/templates/connectors/consumption-protocol.md. `ticket_ref` is
# a lifecycle-unit field only -- the connector descriptor schema is unchanged.
#
# STATE ADVANCEMENT ORDERING (authoritative source; schemas.md inline copy is downstream)
#
# Ordered from most-advanced to least-advanced:
#   1. Done           -- task completed and accepted; all subtasks resolved
#   2. Canceled       -- resolved terminal (explicitly abandoned); ranks just below Done
#   3. In Review      -- work submitted; awaiting reviewer decision
#   4. In Progress    -- actively being executed on its delivery branch
#   5. Blocked        -- attempted but impeded; recoverable-in-place; more actionable than Failed
#   6. Failed         -- completed attempt rejected; a parallel branch may have superseded
#   7. Pending        -- not yet started
#
# Rationale: the dashboard "most-advanced wins" reconcile answers "how far has
# this work gotten across all worktree branches." Done/Canceled are
# terminal-resolved and rank highest. In Review outranks In Progress (review
# is a later pipeline stage). Blocked outranks Failed because a blocked task
# is recoverable-in-place and signals "needs attention now," whereas a failed
# task represents a completed-but-rejected attempt that a parallel branch may
# have already superseded -- surfacing "blocked" is the more actionable
# signal. Both Blocked and Failed rank above Pending because they represent
# work that was attempted and surfaced information (more informative than
# "not started").
#
# Closed enum VALUES (unchanged): Pending | In Progress | In Review | Blocked | Done | Failed | Canceled
#
# This ordering is encoded ONCE here. Both reader twins (Python + Node)
# reference schemas.md for the ordered list at runtime; schemas.md carries an
# inline copy derived from this source.

# [W]
#   path: lite | full  -- lite = flattened (no deliveries/ wrapper); full = deliveries/delivery-NNN/ wrapper
#   initiator: aid-describe | aid-{shortcut-skill}  -- the pipeline-starting skill: aid-describe, or a shortcut-catalog.yml skill (e.g. aid-fix, aid-refactor, aid-create-api)
pipeline:
  path: lite
  initiator: aid-orchestrate
# [W]
started: '2026-10-26'
# [W] resolved at runtime by `bash canonical/aid/scripts/config/read-setting.sh --skill {phase} --key minimum_grade --default A`; source is `.aid/settings.yml`
minimum_grade: A
# [W] 'yes' | 'no' -- quoted, see NFR-2 / D-5
user_approved: 'yes'
# [W] Running | Paused-Awaiting-Input | Blocked | Completed | Canceled
lifecycle: Running
# [W] Describe | Define | Specify | Plan | Detail | Execute
phase: Execute
# [W] aid-{skill} | none
active_skill: none
# [W]
updated: '2026-10-26T00:18:44Z'
# [W] set only when lifecycle = Paused-Awaiting-Input
pause_reason: --
# [W] set only when lifecycle = Blocked
block_reason: --
# [W] e.g. IMPEDIMENT-task-NNN.md, or the failed gate
block_artifact: --
# [W] {connector-stem}:{external-id} | -- -- OPTIONAL; e.g. jira:PROJ-123; see the ticket_ref note above
ticket_ref: --

# Flattened single-delivery works only -- omit these 4 keys for full works.
# [W] Pending-Spec | Specified | Executing | Gated | Done | Blocked
delivery_state: Pending-Spec
# [W] Small | Medium | Large
gate_tier: Small
# [W]
gate_grade: Pending
# [W]
gate_timestamp: --

# [A] updated by aid-describe as each section is completed.
#   state: In Progress | Complete | Approved
#   grade: {grade} | Pending
#   sections[].state: Pending | Complete
interview:
  state: 'In Progress'
  grade: Pending
  sections:
    - id: 1
      name: Objective
      state: Pending
      updated: --
    - id: 2
      name: 'Problem Statement'
      state: Pending
      updated: --
    - id: 3
      name: 'Users & Stakeholders'
      state: Pending
      updated: --
    - id: 4
      name: Scope
      state: Pending
      updated: --
    - id: 5
      name: 'Functional Requirements'
      state: Pending
      updated: --
    - id: 6
      name: 'Non-Functional Requirements'
      state: Pending
      updated: --
    - id: 7
      name: Constraints
      state: Pending
      updated: --
    - id: 8
      name: 'Assumptions & Dependencies'
      state: Pending
      updated: --
    - id: 9
      name: 'Acceptance Criteria'
      state: Pending
      updated: --
    - id: 10
      name: Priority
      state: Pending
      updated: --

# [A] one entry per feature, in id order. Created by aid-define at feature
#     decomposition (one entry per `### Feature NNN` section it appends to
#     REQUIREMENTS.md § 11) and updated by aid-specify as each feature
#     advances. Present on BOTH layouts -- a feature is a work-level concept,
#     so this key is never omitted for a full multi-delivery work.
#
#     A feature is a SECTION, not a folder: `id` identifies
#     `REQUIREMENTS.md § 11 ### Feature NNN`, and there is no
#     features/feature-NNN/ directory and no per-feature SPEC.md to point at.
#     Ids are never reused or renumbered -- a withdrawn feature keeps its
#     entry with `withdrawn: true` so that every citation of it still
#     resolves, and the number is not handed to a later feature.
#
#     `state` and `grade` describe that section's `#### Technical
#     Specification` -- the part aid-specify fills. `sections` is the
#     per-technical-section progress aid-specify tracks while it works
#     through The Loop; it is the declared home for that tracking and is
#     legitimately empty until aid-specify has run.
#
#   id:       '001'.. -- quoted, so a leading zero survives the YAML read
#   name:     short slug; the §11 section title is authoritative
#   state:    Pending | In Discussion | Spike Needed | Blocked | Ready
#   grade:    {grade} | Pending
#   qa_count: integer
#   withdrawn: true -- omit the key entirely for a live feature
#   sections[].state: Pending | In Discussion | Complete
features: []

# [A] appended by aid-describe / aid-define as the interview and its
#     cross-reference pass proceed. Append-only, newest LAST. Distinct from
#     `lifecycle_history`, which records PHASE transitions and gates: this
#     records what happened INSIDE the interview -- a question round, a
#     stakeholder comment pass, a quality check, a cross-reference cycle.
#
#     Declared because the alternative is losing it. It lived under a
#     `### Review History` heading inside the legacy markdown `## Interview State`
#     section with no key of its own, which made it invisible to the schema and
#     mergeable into `interview.sections` by anything reading tables from that
#     range. A table the schema does not name is still data.
#
#   - date / event / outcome / notes
review_history: []

# [A] written by the orchestrator on the work's active branch (single
#     writer). Append-only audit trail of phase transitions and gate
#     approvals, newest LAST (append to bottom).
lifecycle_history:
  - date: '2026-10-26'
    event: 'Work created'
    grade: --
    notes: 'Scaffolded from master; definition approved under work-003 Q209'
  - date: '2026-10-26'
    event: 'Phase 0 harness built'
    grade: --
    notes: 'tests/measure/measure.py; baseline runs pending on the maintainer machine'
  - date: '2026-10-26'
    event: 'Step 1 built and reviewed'
    grade: --
    notes: 'One independent review: 4 MEDIUM, 7 LOW, none higher; 10 fixed, 1 out of scope (merge order with work-003). C1 measurement pending on the maintainer machine'

# [A] aid-deploy only; one entry per delivery (never derived from child
#     files; aid-deploy is the sole author):
#   - delivery / state / pr / kb_updated / tag / notes
deploy: []

# [A] flattened only; single writer: this work's active branch. Written by
#     aid-plan, aid-specify, aid-execute across the delivery pipeline for the
#     synthesized delivery-001. Never derived from task rollup. `updated` is
#     a writer-targeted child key (L-2).
delivery_lifecycle:
  updated: '2026-01-01T00:00:00Z'
  block_reason: --
  block_artifact: --

# [W] flattened only -- one entry per task, keyed by task-NNN, REPLACING the
#     now-absent per-task STATE.yml (each task is tasks/task-NNN/DETAIL.md
#     only -- immutable, no sibling STATE.yml). Written by
#     `writeback-state.sh --task-id NNN --field <field> --value <value>`,
#     targeting this mapping instead of a delivery-NNN/tasks/task-NNN/STATE.yml.
#     Mirrors the fields of task-state-template.yml (state/review/elapsed/
#     notes/display_name), one entry per task-NNN.
#   state: Pending | In Progress | In Review | Blocked | Done | Failed | Canceled
tasks_lifecycle: {}

# [A] flattened only; single writer: the delivery-gate closing step of
#     aid-execute on this work's active branch, written via
#     `writeback-state.sh --delivery-id 001 --block ...`. Distinct from
#     per-task quick-check findings -- the gate aggregates those deferred
#     [HIGH] rows (via .aid/works/{work}/delivery-001-issues.md; see
#     canonical/aid/templates/delivery-issues.md) and runs a full grade.sh
#     pass. `issue_list` is a writer-targeted child key (--append-issue, L-2).
#   issue_list: severity-tagged strings, or [] when the gate passed clean
delivery_gate:
  issue_list: []

# [A] flattened Lite only (AUTHORED here, not derived); one entry per
#     question:
#   - id / category (e.g. Architecture, Requirements, Security) /
#     impact: High | Medium | Low | Required /
#     state: Pending | Answered | Skipped /
#     context / suggested / answer / applied_to
qa:
  - id: Q1
    category: Direction
    impact: High
    state: Answered
    context: 'Do you approve the re-analysis report as the new direction (work-003 Q209)?'
    suggested: 'Approve'
    answer: '1'
    applied_to: 'DEFINITION.md is this work''s definition: faster, cheaper, less bureaucratic; Phase 0 measures real runs first'
  - id: Q2
    category: Setup
    impact: High
    state: Answered
    context: 'Should the new lean-AID work start fresh from master, leaving work-003 on its branch, or build on work-003?'
    suggested: '1: fresh from master'
    answer: '1'
    applied_to: 'Branch work-004 from master; work-003 stays on its branch, pieces ported one by one when measured'
  - id: Q9
    category: Scope
    impact: High
    state: Answered
    context: 'After step 1 AID adds about 7,500 tokens to the start context (+40%, goal +25%); 12 of 12 results were correct. The skill list is about 4,700 of those tokens, about 42 per skill. How should step 1 close?'
    suggested: 'Merge the 75 kind variants into their family skills, with the kind as an argument (112 to about 37 skills), then measure again'
    answer: '1'
    applied_to: 'STEP-1.md C3; canonical/skills kind families'
  - id: Q8
    category: Scope
    impact: High
    state: Answered
    context: 'Step 1 halved AID''s own context, but the measuring tool cannot tell a right result from a wrong one (the fix scenario has no real bug; its tests check nothing the request changes) and one run each is too noisy. What next?'
    suggested: 'Fix the measuring tool first (a real planted bug, hidden checks for both tasks, 3 runs each), fix the missing-card note, then measure step 1 again'
    answer: '1'
    applied_to: 'tests/measure/ (planted bug, hidden checks, runs); installer card import'
  - id: Q7
    category: Scope
    impact: Medium
    state: Answered
    context: 'Should the merge-blocking hook (C7) stay in step 1?'
    suggested: 'Move it to step 3 with push protection'
    answer: 'Assumed by the agent: master''s installer has no hook support (work-003 needed about 900 lines in two installer twins for it), which breaks the one-day budget; step 3 needs the same machinery. Confirmed with the step-1 result approval'
    applied_to: 'STEP-1.md C7'
  - id: Q6
    category: Technical
    impact: Medium
    state: Answered
    context: 'How should the skill list shrink without breaking skills that other skills start?'
    suggested: 'Shorten every description (about 10 entry skills at most 300 characters, the rest about 100); hide none'
    answer: 'Assumed by the agent: disable-model-invocation also stops other skills from starting a skill, and aid-execute, aid-fix, aid-specify and aid-review are started that way; shortening alone cuts about 64k to 13k characters. Confirmed with the step-1 result approval'
    applied_to: 'STEP-1.md C3'
  - id: Q5
    category: Plan
    impact: High
    state: Answered
    context: 'Do you approve STEP-1.md, the foundation goal card: about 5k always-loaded tokens instead of 20k, rules loaded once, about 10 listed skills, a project card and a merge-blocking hook, within about one day?'
    suggested: 'Approve: the skill list is most of the measured overhead, and every criterion is checkable'
    answer: '1'
    applied_to: 'STEP-1.md approved; build step 1'
  - id: Q4
    category: Design
    impact: High
    state: Answered
    context: 'Do you approve DESIGN.md as the lean-AID design: evidence over opinion, a direct lane for small tasks, a planned lane with a goal card, tests first and bounded review, and project rules as checks?'
    suggested: 'Approve: it answers the three needs with mechanisms that converge, and each step is proven by measurement'
    answer: '1'
    applied_to: 'DESIGN.md approved; build order: foundation, direct lane, planned lane, benchmark'
  - id: Q3
    category: Measurement
    impact: High
    state: Answered
    context: 'Is this enough measuring to set the baseline and start the changes?'
    suggested: '3: first measure a larger feature with and without AID, graded by hidden acceptance tests, to learn whether the heavy process pays off at all before redesigning it'
    answer: '3 (through Q4)'
    applied_to: 'The benchmark of DESIGN.md section D on this repo replaces more runs of the old skill path'
