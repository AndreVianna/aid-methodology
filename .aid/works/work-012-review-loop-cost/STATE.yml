# [A] DELIBERATE DEVIATION, recorded rather than silent.
#
# artifact-schemas.md "Work STATE.yml" says qa has "no key at all on the
# full path (DERIVED)" -- yet the SAME row defines the derived union as
# "each delivery's Q&A + work-owner entries". Work-owner entries are
# therefore named as a real input to the union while having no declared
# home on disk, and a Describe-phase work like this one has no deliveries
# to derive from at all. Omitting the key would silently destroy four
# owner decisions, two of them already answered and load-bearing (Q-01
# sets NFR-1's exit criterion; Q-02 sets where an oracle lives).
#
# So the key is kept, in the exact per-entry shape the schema declares
# (category / impact / state / context / suggested / answer / applied_to).
# A reader that derives instead of reading it loses nothing. This is the
# same class of gap the conversion already tracks as SY-4 (Seed Authoring),
# and it is reported for its own tech-debt row.
qa:
  - id: 'Q-01'
    category: 'Requirements / exit criterion'
    impact: Required
    state: Answered
    context: >-
      work-004's owner revision (2026-08-14) redefined the "added mechanism"
      side of its NFR-2 as EXECUTABLE surface only, explicitly excluding
      authored instruction. Remedy 2 adds executable surface by design --
      every oracle is a script -- so this is the first work where that
      definition bites. NFR-1 states the exit criterion as "an oracle is
      justified only where it REPLACES recurring human re-derivation, and the
      work measures the trade rather than asserting it". It needed owner
      ratification before Specify, because AC-11 is derived from it and it
      decides whether an oracle can ship at all.
    suggested: >-
      Ratify as written. The four grounds the owner used in the work-004
      revision point the same way: an oracle is not a guard bolted onto
      prose, it is the removal of a recurring re-derivation, so the cost it
      adds is paid back per cycle rather than owed.
    answer: >-
      OWNER DECISION 2026-08-14 -- option A, ratified as drafted. An oracle
      ships only where it REPLACES recurring human re-derivation, and the
      work measures the trade rather than asserting it. Each oracle records
      what re-derivation it replaces and that re-derivation's per-cycle cost;
      the work reports the net. An oracle with no recorded replacement is not
      shipped. The two rejected alternatives are recorded because the reason
      matters downstream: a hard numeric cap was rejected as a figure
      invented with nothing to ground it, and determinism-alone justification
      was rejected because it removes the only test that stops oracles
      accumulating on criteria nobody re-derives.
    applied_to: 'REQUIREMENTS.md NFR-1 (now ratified rather than proposed) and AC-11, the criterion that tests it'
  - id: 'Q-02'
    category: Architecture
    impact: High
    state: Answered
    context: >-
      Where does an oracle live on disk? L5's worked example writes
      "oracle: scripts/checks/g07-selector-partition.sh", a project-relative
      path. But a criterion declared in a project's own
      .aid/knowledge/authoring-conventions.md is project-specific, while G-07
      is AID's own criterion about AID's own corpus -- and anything under
      canonical/ renders into five profiles/ trees and two dogfood trees. The
      choice decides whether an adopter's oracle and AID's own share a
      resolution rule, and whether NFR-5's single render covers them.
    suggested: >-
      A project-relative path resolved from the repo root, so an adopter's
      oracle and AID's own resolve identically; AID's own oracles then live
      outside canonical/ and stay out of the render chain.
    answer: >-
      OWNER DECISION 2026-08-14 -- option A. An oracle: value is a path
      resolved from the repo root, and oracles live OUTSIDE canonical/. One
      resolution rule serves AID's own criteria and an adopter's identically,
      which follows from the criteria themselves being project-specific --
      the reason work-004 put the criteria tables in .aid/knowledge/ rather
      than in canonical/. An oracle is the executable half of a
      project-specific criterion, so it belongs to the project rather than to
      the shipped toolkit. Second consequence, deliberate: no oracle enters
      the canonical/ render chain, so none is multiplied across the five
      profiles/ trees and the two dogfood trees. Rejected: shipping AID's
      oracles under canonical/aid/scripts/ (it does not cover the adopter
      case, so it needs this rule anyway and yields two rules instead of
      one), and placing them beside the criteria in .aid/knowledge/ (that
      tree is documents-only).
    applied_to: 'REQUIREMENTS.md FR-8 (the key value contract) and NFR-5 (the render-chain exclusion)'
  - id: 'Q-03'
    category: 'Requirements / measurement'
    impact: High
