      ever have read them. Stop is specified, bounded by the row's
      expressible path half so a genuine orphan elsewhere still reports
      VIOLATION rather than being softened to UNDECIDED.
      Measured, not asserted: 203 of 276 in-scope files decided, 74%. The
      undecided 73 are all of canonical/aid/templates/, because
      template-payload's recognizers test frontmatter SHAPE and template-own
      sits behind it in the same path space. A content-pattern clause that
      would rescue them is refused -- 74% at a grammar a human can check by
      eye beats 100% at one nobody can verify.
