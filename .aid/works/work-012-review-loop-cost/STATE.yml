# Work State -- work-012-review-loop-cost
#
# FULL multi-delivery work. Per work-state-template.yml's full-layout
# omission rule, these keys are absent: delivery_state, gate_tier,
# gate_grade, gate_timestamp, delivery_lifecycle, tasks_lifecycle,
# delivery_gate. Each delivery's own lifecycle/gate will live in its
# deliveries/delivery-NNN/STATE.yml.
#
# `qa` IS present, and that is a deliberate, recorded deviation -- see the
# note above the key itself.
#
# Converted from the pre-format-4 STATE.md by hand, NOT by `aid migrate`'s
# STEP 5 converter. The converter was run first, in a sandbox, and its
# output was rejected: it dropped all four Q&A entries and mis-parsed an
# authored table. Both defects are reproduced and recorded in
# lifecycle_history below.

# [W]
#   path: lite | full
#   initiator: aid-describe | aid-{shortcut-skill}
pipeline:
  path: full
  initiator: aid-describe
# [W]
started: '2026-08-14'
# [W] resolved at runtime by `read-setting.sh --skill describe --key minimum_grade --default A`
minimum_grade: A
# [W] 'yes' | 'no' -- quoted
user_approved: 'no'
# [W] Running | Paused-Awaiting-Input | Blocked | Completed | Canceled
lifecycle: Paused-Awaiting-Input
# [W] Describe | Define | Specify | Plan | Detail | Execute
phase: Describe
# [W] aid-{skill} | none
active_skill: aid-describe
# [W]
updated: '2026-08-14T20:20:00Z'
# [W] set only when lifecycle = Paused-Awaiting-Input
pause_reason: 'Awaiting owner approval; Q-01..Q-03 answered, Q-04 open (Specify-time)'
# [W] set only when lifecycle = Blocked
block_reason: --
# [W] e.g. IMPEDIMENT-task-NNN.md, or the failed gate
block_artifact: --
# [W] {connector-stem}:{external-id} | --
ticket_ref: --

