  - id: 'Q-04'
    category: Process
    impact: Medium
    state: Answered
    context: >-
      Who generates an oracle, and when? FR-10 says "generated once", but not
      whether that happens when the criterion is authored, or lazily the
      first time a reviewer meets a criterion that ought to have one. This
      affects whether a criterion can be declared without its oracle existing
      yet -- which FR-8 permits, since absence is never a defect.
    suggested: >-
      At criterion-authoring time when the author knows the check is
      mechanical; otherwise lazily, on the first cycle where a reviewer
      re-derives the same criterion twice.
    answer: >-
      OWNER DECISION 2026-08-14 -- option B, LAZY. An oracle is written the
      first time a reviewer re-derives the same criterion a second time. The
      recurrence is the trigger, so the evidence that the oracle pays for
      itself exists BEFORE the script does -- which is what makes this the
      only option that enforces NFR-1 rather than trusting it. Eager
      authoring (option A) was rejected because it asks an author to PREDICT
      recurrence, the same guess refused in Q-03; "eager when obvious, lazy
      otherwise" (option C) was rejected because "plainly mechanical" is a
      judgment that quietly becomes "always eager". The accepted cost is real
      and small: two full-price cycles before any oracle appears. G-07 is not
      delayed by this rule -- L5 already records it being re-derived every
      cycle, so its evidence predates the rule and the worked example can be
      written immediately.
    applied_to: 'REQUIREMENTS.md FR-10 (the generation trigger) and FR-13 (G-07 exempt from the wait, evidence already on record)'
