# [A] flattened only; single writer: this work's active branch. Written by
#     aid-plan, aid-specify, aid-execute across the delivery pipeline for the
#     synthesized delivery-001. Never derived from task rollup. `updated` is
#     a writer-targeted child key (L-2).
delivery_lifecycle:
  updated: '2026-01-01T00:00:00Z'
  block_reason: --
  block_artifact: --

# [W] flattened only -- one entry per task, keyed by task-NNN, REPLACING the
#     now-absent per-task STATE.yml (each task is tasks/task-NNN/DETAIL.md
#     only -- immutable, no sibling STATE.yml). Written by
#     `writeback-state.sh --task-id NNN --field <field> --value <value>`,
#     targeting this mapping instead of a delivery-NNN/tasks/task-NNN/STATE.yml.
#     Mirrors the fields of task-state-template.yml (state/review/elapsed/
#     notes/display_name), one entry per task-NNN.
#   state: Pending | In Progress | In Review | Blocked | Done | Failed | Canceled
tasks_lifecycle: {}

# [A] flattened only; single writer: the delivery-gate closing step of
#     aid-execute on this work's active branch, written via
#     `writeback-state.sh --delivery-id 001 --block ...`. Distinct from
#     per-task quick-check findings -- the gate aggregates those deferred
#     [HIGH] rows (via .aid/works/{work}/delivery-001-issues.md; see
#     canonical/aid/templates/delivery-issues.md) and runs a full grade.sh
#     pass. `issue_list` is a writer-targeted child key (--append-issue, L-2).
#   issue_list: severity-tagged strings, or [] when the gate passed clean
delivery_gate:
  issue_list: []

# [A] flattened Lite only (AUTHORED here, not derived); one entry per
