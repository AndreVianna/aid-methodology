deploy: []

# [A] flattened only; single writer: this work's active branch. Written by
#     aid-plan, aid-specify, aid-execute across the delivery pipeline for the
#     synthesized delivery-001. Never derived from task rollup. `updated` is
#     a writer-targeted child key (L-2).
delivery_lifecycle:
  updated: '2026-01-01T00:00:00Z'
  block_reason: --
  block_artifact: --

# [W] flattened only -- one entry per task, keyed by task-NNN, REPLACING the
#     now-absent per-task STATE.yml (each task is tasks/task-NNN/DETAIL.md
#     only -- immutable, no sibling STATE.yml). Written by
#     `writeback-state.sh --task-id NNN --field <field> --value <value>`,
#     targeting this mapping instead of a delivery-NNN/tasks/task-NNN/STATE.yml.
#     Mirrors the fields of task-state-template.yml (state/review/elapsed/
#     notes/display_name), one entry per task-NNN.
#   state: Pending | In Progress | In Review | Blocked | Done | Failed | Canceled
tasks_lifecycle: {}

# [A] flattened only; single writer: the delivery-gate closing step of
#     aid-execute on this work's active branch, written via
#     `writeback-state.sh --delivery-id 001 --block ...`. Distinct from
#     per-task quick-check findings -- the gate aggregates those deferred
#     [HIGH] rows (via .aid/works/{work}/delivery-001-issues.md; see
#     canonical/aid/templates/delivery-issues.md) and runs a full grade.sh
#     pass. `issue_list` is a writer-targeted child key (--append-issue, L-2).
#   issue_list: severity-tagged strings, or [] when the gate passed clean
delivery_gate:
  issue_list: []

# [A] flattened Lite only (AUTHORED here, not derived); one entry per
#     question:
#   - id / category (e.g. Architecture, Requirements, Security) /
#     impact: High | Medium | Low | Required /
#     state: Pending | Answered | Skipped /
#     context / suggested / answer / applied_to
qa:
  - id: Q1
    category: Requirements
    impact: High
    state: Answered
    context: 'Where does Describe''s job go? Definition only makes a seed, but today Describe writes REQUIREMENTS.md §1-10, and FR-1 gives that file to Specification. (surfaced by /aid-define cross-reference)'
    suggested: 'The requirements interview moves to /aid-specify (Feature 005); Definition keeps only idea-shaping and ticket digestion.'
    answer: 'No separate interview: the Q&A is one protocol (FR-17) used by every skill that needs input from the user; /aid-specify gathers requirements through it.'
    applied_to: 'REQUIREMENTS.md FR-17, NFR-Q, AC-28, Feature 002'
  - id: Q2
    category: Requirements
    impact: High
    state: Answered
    context: 'How does a ticket flow? FR-1/AC-14 put ticket digestion in Definition; Objective/AC-7 send a rich ticket straight to requirements + plan. Feature 003 owns no ticket criterion. (surfaced by /aid-define cross-reference)'
    suggested: 'A ticket gets a light Definition digest (no seed), then goes to Specification; add a ticket-intake AC owned by Feature 003.'
    answer: 'External sources enter at any moment, not only Definition. Two kinds: project sources (in the KB, used by every work when needed) and work sources (recorded in the work STATE). Info is analysed and applied (may advance phase, answer or raise questions); two-way update on request.'
    applied_to: 'REQUIREMENTS.md FR-18, AC-29, AC-14, FR-1, FR-11, Features 001 and 003'
  - id: Q3
    category: Requirements
    impact: High
    state: Answered
    context: 'Do per-task DETAIL.md files survive? Planning absorbs Detail and PLAN.md is a light TODO list, but /aid-execute reads each task DETAIL.md as its brief. (surfaced by /aid-define cross-reference)'
    suggested: 'Keep one immutable DETAIL.md per task, no per-task state file.'
    answer: 'Keep one instruction file per task (instructions only, no state); PLAN.md links to it; progress in the work STATE.yml.'
    applied_to: 'REQUIREMENTS.md FR-12, AC-19, Feature 006'
  - id: Q4
    category: Requirements
    impact: High
    state: Answered
    context: 'Feature 002: the skill state-machine handling has no FR and no AC (the Q&A part is now FR-17 / AC-28). (surfaced by /aid-define cross-reference)'
    suggested: 'Add an FR and an observable AC for each, owned by Feature 002.'
    answer: 'Steps invisible; current step saved; stops use FR-17; one shared rule set; plus automatic hand-offs to another skill at the end or mid-process (returning to the same step) -- state machine and STATE.yml reviewed as a whole.'
    applied_to: 'REQUIREMENTS.md FR-20, AC-37, AC-38, Feature 002'
  - id: Q5
    category: Architecture
    impact: Medium
    state: Answered
    context: 'One branch per work or per delivery? FR-6 says the work branch; /aid-execute uses aid/{work}-delivery-NNN branches and still mentions merge to main. (surfaced by /aid-define cross-reference)'
    suggested: 'One branch per work; deliveries are only groupings.'
    answer: 'Always one worktree and one branch (when pushed) per work; no per-delivery branches; /aid-execute has been wrong and is corrected.'
    applied_to: 'REQUIREMENTS.md FR-6, AC-34, Feature 007'
  - id: Q6
    category: Scope
    impact: Medium
    state: Answered
    context: '§4 puts adjusting the dashboard and chat to the new layout/names in scope, but no feature or AC owns it. (surfaced by /aid-define cross-reference)'
