    context: 'Unclaimed skills: create/update-{architecture,stack,testing-strategy,cicd} (8), aid-triage, aid-housekeep are owned by no feature and overlap /aid-kb-update. (surfaced by /aid-define cross-reference)'
    suggested: 'The 8 retire into /aid-kb-update (Feature 004); aid-triage into the rules.md skill guide (Feature 001); each owner writes its AC-24 rows.'
    answer: 'KB-writing skills and aid-housekeep fold into Feature 004; aid-triage into the skill guide (Feature 001).'
    applied_to: 'Features 001, 004, 009'
  - id: Q8
    category: Requirements
    impact: Medium
    state: Answered
    context: 'Can AID open a PR without a pipeline? CI runs only with a pipeline, yet opening the PR is part of CI and every depth ends before a PR. (surfaced by /aid-define cross-reference)'
    suggested: 'CI runs whenever the user asks for a PR/MR; the until-green step is skipped when there is no pipeline.'
    answer: 'CI always closes the work (minimum: mark done, even without git); PR/MR on instruction; pipeline steps only when a pipeline exists. Only real changes pushed; local-only clean-up after merge; never delete a remote branch.'
