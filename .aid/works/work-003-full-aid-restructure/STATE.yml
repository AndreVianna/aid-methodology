# [A] flattened Lite only (AUTHORED here, not derived); one entry per
#     question:
#   - id / category (e.g. Architecture, Requirements, Security) /
#     impact: High | Medium | Low | Required /
#     state: Pending | Answered | Skipped /
#     context / suggested / answer / applied_to
qa:
  - id: Q1
    category: Requirements
    impact: High
    state: Answered
    context: 'Where does Describe''s job go? Definition only makes a seed, but today Describe writes REQUIREMENTS.md §1-10, and FR-1 gives that file to Specification. (surfaced by /aid-define cross-reference)'
    suggested: 'The requirements interview moves to /aid-specify (Feature 005); Definition keeps only idea-shaping and ticket digestion.'
    answer: 'No separate interview: the Q&A is one protocol (FR-17) used by every skill that needs input from the user; /aid-specify gathers requirements through it.'
    applied_to: 'REQUIREMENTS.md FR-17, NFR-Q, AC-28, Feature 002'
  - id: Q2
    category: Requirements
    impact: High
    state: Answered
    context: 'How does a ticket flow? FR-1/AC-14 put ticket digestion in Definition; Objective/AC-7 send a rich ticket straight to requirements + plan. Feature 003 owns no ticket criterion. (surfaced by /aid-define cross-reference)'
    suggested: 'A ticket gets a light Definition digest (no seed), then goes to Specification; add a ticket-intake AC owned by Feature 003.'
    answer: 'External sources enter at any moment, not only Definition. Two kinds: project sources (in the KB, used by every work when needed) and work sources (recorded in the work STATE). Info is analysed and applied (may advance phase, answer or raise questions); two-way update on request.'
    applied_to: 'REQUIREMENTS.md FR-18, AC-29, AC-14, FR-1, FR-11, Features 001 and 003'
  - id: Q3
    category: Requirements
    impact: High
    state: Answered
    context: 'Do per-task DETAIL.md files survive? Planning absorbs Detail and PLAN.md is a light TODO list, but /aid-execute reads each task DETAIL.md as its brief. (surfaced by /aid-define cross-reference)'
    suggested: 'Keep one immutable DETAIL.md per task, no per-task state file.'
    answer: 'Keep one instruction file per task (instructions only, no state); PLAN.md links to it; progress in the work STATE.yml.'
    applied_to: 'REQUIREMENTS.md FR-12, AC-19, Feature 006'
  - id: Q4
    category: Requirements
    impact: High
    state: Answered
    context: 'Feature 002: the skill state-machine handling has no FR and no AC (the Q&A part is now FR-17 / AC-28). (surfaced by /aid-define cross-reference)'
    suggested: 'Add an FR and an observable AC for each, owned by Feature 002.'
    answer: 'Steps invisible; current step saved; stops use FR-17; one shared rule set; plus automatic hand-offs to another skill at the end or mid-process (returning to the same step) -- state machine and STATE.yml reviewed as a whole.'
    applied_to: 'REQUIREMENTS.md FR-20, AC-37, AC-38, Feature 002'
  - id: Q5
    category: Architecture
    impact: Medium
    state: Answered
    context: 'One branch per work or per delivery? FR-6 says the work branch; /aid-execute uses aid/{work}-delivery-NNN branches and still mentions merge to main. (surfaced by /aid-define cross-reference)'
    suggested: 'One branch per work; deliveries are only groupings.'
    answer: 'Always one worktree and one branch (when pushed) per work; no per-delivery branches; /aid-execute has been wrong and is corrected.'
    applied_to: 'REQUIREMENTS.md FR-6, AC-34, Feature 007'
  - id: Q6
    category: Scope
    impact: Medium
    state: Answered
    context: '§4 puts adjusting the dashboard and chat to the new layout/names in scope, but no feature or AC owns it. (surfaced by /aid-define cross-reference)'
    suggested: 'State layout to Feature 006, skill names to Feature 009, each with an AC.'
    answer: 'Skill names in dashboard/chat owned by Feature 009 (AC-31); state-layout adjustment still to place.'
    applied_to: 'Feature 009, AC-31'
  - id: Q7
    category: Scope
    impact: Medium
    state: Answered
    context: 'Unclaimed skills: create/update-{architecture,stack,testing-strategy,cicd} (8), aid-triage, aid-housekeep are owned by no feature and overlap /aid-kb-update. (surfaced by /aid-define cross-reference)'
    suggested: 'The 8 retire into /aid-kb-update (Feature 004); aid-triage into the rules.md skill guide (Feature 001); each owner writes its AC-24 rows.'
    answer: 'KB-writing skills and aid-housekeep fold into Feature 004; aid-triage into the skill guide (Feature 001).'
    applied_to: 'Features 001, 004, 009'
  - id: Q8
    category: Requirements
    impact: Medium
    state: Answered
    context: 'Can AID open a PR without a pipeline? CI runs only with a pipeline, yet opening the PR is part of CI and every depth ends before a PR. (surfaced by /aid-define cross-reference)'
    suggested: 'CI runs whenever the user asks for a PR/MR; the until-green step is skipped when there is no pipeline.'
    answer: 'CI always closes the work (minimum: mark done, even without git); PR/MR on instruction; pipeline steps only when a pipeline exists. Only real changes pushed; local-only clean-up after merge; never delete a remote branch.'
    applied_to: 'REQUIREMENTS.md FR-1, FR-7, §4, AC-14, AC-35, AC-36, Feature 008'
  - id: Q9
    category: Requirements
    impact: Medium
    state: Answered
    context: 'AC-27: do CI fixes after the final approval need re-approval, and when does the fix loop stop? (surfaced by /aid-define cross-reference)'
    suggested: 'Summarize post-approval changes for re-approval; stop and report after 3 failed fix attempts.'
    answer: 'Bugs/required corrections fixed automatically; suggestions/comments evaluated and brought to the user with options and a recommendation; every correction is a build and must be approved before push. Same failure after 3 attempts: stop and ask (assumed).'
    applied_to: 'REQUIREMENTS.md FR-7, AC-27, Feature 008'
  - id: Q10
    category: Requirements
    impact: Medium
    state: Answered
    context: 'FR-2 says the user does not trigger KB skills; FR-8/AC-21 say any skill can be invoked. (surfaced by /aid-define cross-reference)'
    suggested: 'Reword FR-2 to: the user never needs to trigger them.'
    answer: 'Reworded FR-2: the user never needs to trigger KB skills (they stay invocable).'
    applied_to: 'REQUIREMENTS.md FR-2'
  - id: Q11
    category: Requirements
    impact: Medium
    state: Answered
    context: '"fast" means approval depth (FR-6) but Feature 009 calls the one-pass path "fast"; the KB has a "Lite fast path" and pipeline.path full|lite. (surfaced by /aid-define cross-reference)'
    suggested: 'full/fast/direct mean approval depth only; reword Feature 009; retire the lite/full layout terms.'
    answer: 'Approval depth is full / lite (the old layout terms keep their names but now mean approval depth). The word fast is dropped everywhere.'
    applied_to: 'REQUIREMENTS.md FR-6, §4, AC-7, AC-10, Features 001 and 009'
  - id: Q12
    category: Requirements
    impact: Medium
    state: Answered
    context: 'When is direct chosen, and what deletes the seed when requirements are never separately approved? (surfaced by /aid-define cross-reference)'
    suggested: 'direct for bug fixes and small refactors with a defined problem; delete the seed at the first approval covering the requirements.'
    answer: 'No direct depth: the agent always confirms what it is about to build. Depths are full and fast only.'
    applied_to: 'REQUIREMENTS.md FR-6, §4, Feature 001'
  - id: Q13
    category: Requirements
