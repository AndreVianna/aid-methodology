        per-task GROUNDING READ; the cost of writing a document was never modelled.

        "size discipline alone worth ~60%, with no structural change"  ->  ~38%, stable at
        38-40% across every parameter set in the stated range. 60% is only reachable by
        comparing undisciplined `today` against a disciplined RESTRUCTURED shape -- the
        exact conflation that clause denies. Real mechanism, oversold by ~20 points.

      MOVED SINCE:
        15.79MB -> 7.04MB for the modelled work (-55%). Gate share 88.9% -> 65.5%.
        Gate:grounding 8.0x -> 1.9x.

      THE FINDING THAT MATTERS more than the total: the problem has INVERTED. The dearest
      line is no longer `gate SPEC (per feature)` at 4.49MB but `task grounding` at
      2.43MB -- and grounding is paid PER TASK, so it scales with task count where a gate
      does not. Anything further aimed at gates is aimed at the smaller half. The unbuilt
      `folded-sliced` grounding slice models the next 10 points (7.04 -> 5.42MB).

      MOVED THE WRONG WAY: always-on surface 12,712 -> 18,428 tokens (+45%), skills
      76 -> 111. work-006's design family, not a regression here, and AC-2's diff gate does
