  - id: Q21
    question: 'The in-process port: do three implementations of one sort agree?'
    state: Resolved
    answer: |
      Yes, and the test proves it against the REFERENCE rather than only against itself.

      reader.py and reader.mjs now derive lanes from the task DETAILs' `**Depends on:**`
      fields. A work holding only STATE.yml and tasks/ -- no PLAN.md, no SPEC.md, no
      BLUEPRINT.md -- reads with correct lanes (1, 2, 2) identically in both runtimes.
      That is AC-13's target shape working end to end.

      It FILLS A GAP rather than replacing a working path, which reading the code
      revealed and the survey had not. Both readers carried the same comment: the flat
      PLAN.md's `## Execution Graph` has no wave-map fence, so parse_execution_graph
      "yields an empty map -- lane stays None for every task ... no lane derivation is
      defined for the flat shape". Every flat task was laneless. So this ADDS information
      the layout never had, and removing its PLAN.md now costs the readers nothing.

      An AUTHORED map still wins where one exists; the derivation only fills an empty
      one. An explicit statement should not be overridden by an inference.

      There are now THREE implementations of one sort (awk, Python, Node) -- the exact
      shape that produced three silent divergences earlier in this work. So the parity
      test has two legs, because agreement between the two PORTS would prove only that
      they match each other, not that either matches the reference: one leg compares the
      twins, the other runs the real derive-waves.sh over a generated work. Both legs
      were verified by breaking each side deliberately -- dropping the foreign-dependency
      rule from Node is caught by the first, an off-by-one join in Python by the second.

      18 fixtures target what a port is most likely to drop: a dependency outside the set
      is already SATISFIED (deliveries run in series; treating it as unsatisfiable
      reports a cycle that does not exist), a self-edge is discarded rather than
      deadlocking, a cycle yields {} rather than a partial map that would read as a
      problem with the TASKS, a diamond join lands one wave after BOTH parents, every
      "no dependencies" spelling agrees, and declaration order does not change the answer.

      One test INVERTED, not deleted: test_reader.py asserted lane=None for a flat task,
      correct only because the derivation did not exist. lane=None would now mean the
      derivation silently did nothing.

      Regression check by diffing FAILURE SETS against origin/master, not counts: reader
      824 tests, server 1306, no new failure on either side.

      WHAT REMAINS for AC-13: the authoring side must stop writing a Lite PLAN.md
      (shortcut engine PLAN state), and the two bash consumers -- complexity-score.sh and
      compute-block-radius.sh -- need the same fallback. Those two are bash, so they can
      CALL derive-waves.sh --from-tasks rather than gaining a fourth and fifth copy of
      the sort.
    decided_by: agent
    updated: '2026-08-15'
  - id: Q20
    question: 'Is removing PLAN.md from the Lite path a saving or a transfer?'
    state: Resolved
    answer: |
      Mostly a saving, and worth doing -- but the measurement changed the reasoning, so
      the recommendation now rests on numbers rather than instinct.

      At Lite dimensions (1 feature, 1 delivery, 3 tasks, 5 cycles): ~94k tokens, ~11%.
      The transfer is real but small -- the delivery definition is a DECISION and still
      needs reviewing, so it moves into REQUIREMENTS (+9k on that gate, +2k on grounding).
      Only the execution graph is a true removal, since derive-waves.sh --from-tasks
      reconstructs it from each task's `**Depends on:**`.

      The split is measured, not assumed: 943 B of a 1325 B PLAN.md body is definition
      (flattened-plan-template.md, instructional header excluded). CONSERVATIVE against
      removal -- the one-task baseline, where the graph is smallest.

      Two things measurement showed that instinct had wrong:

        The saving is a roughly FIXED quantity -- one cycle-multiplied gate point -- not
        a proportion. It grows with cycles (5% at 1, 13% at 7) and SHRINKS as a share as
        tasks rise (14% at 1 task, 6% at 12). It pays best exactly where Lite lives:
        small works that still get properly reviewed.

        At ONE review cycle it barely pays, and on the test fixture it is NEGATIVE
        (-7910 B). With no cycles to multiply, the removed gate point saves nothing while
        the transfer still costs. A shortcut run with review disabled would be made worse
        by this change.

      A correction worth recording, because it nearly became a false justification. The
      first draft of CM38 asserted the change is a NET LOSS at full-path dimensions --
      true on the fixture, whose agent briefs are deliberately tiny, and NOT true at repo
      scale, where the real dispatch floors make the removed gate point dominate. Sign
