qa:
  - id: Q1
    question: 'Does the Lite path keep a PLAN.md?'
    state: Resolved
    answer: 'No. One feature and one delivery means there is no sequencing decision to record, so PLAN would exist only to hold a derived table. Lite = REQUIREMENTS.md + tasks/task-NNN/DETAIL.md + STATE.yml.'
    decided_by: owner
    updated: '2026-08-14'
  - id: Q2
    question: 'Store the Lite execution graph in REQUIREMENTS, or derive it?'
    state: Resolved
    answer: 'Derive it. Each task DETAIL already carries Depends on, so the graph is fully specified by the task set; a stored table is a denormalised view that can disagree with its source. Establishes the general rule: STORE WHAT WAS DECIDED, DERIVE WHAT FOLLOWS FROM IT.'
    decided_by: owner
    updated: '2026-08-14'
  - id: Q3
    question: 'Do judgment-based acceptance criteria get an escape hatch?'
    state: Resolved
    answer: 'Yes, narrowly: a judgment criterion must name what is judged and against what standard, so it stays checkable that the judgment happened against the stated bar. AGENT JUDGMENT, flagged for override -- one paragraph to delete if the owner prefers strict.'
    decided_by: agent
