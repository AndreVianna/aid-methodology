  - id: Q26
    question: 'After four merges, do this work''s founding numbers still hold?'
    state: Resolved
    answer: |
      Two were wrong when written, the rest have moved, and the intent survives all of it.
      Re-ran the same model at the same parameters, including running the meter AT THE
      COMMIT that wrote the objective so the original claims could be checked against the
      tool that produced them rather than against memory.

      WRONG WHEN WRITTEN:
        "60-65% gates / 10-13% authoring / 5-7x"  ->  88.9% / 11.1% / 8.0x. Understated,
        and internally contradictory: 12% at 5-7x implies 60-84% gates, so the text quoted
