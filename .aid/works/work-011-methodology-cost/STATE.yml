  - id: Q21
    question: 'The in-process port: do three implementations of one sort agree?'
    state: Resolved
    answer: |
      Yes, and the test proves it against the REFERENCE rather than only against itself.

      reader.py and reader.mjs now derive lanes from the task DETAILs' `**Depends on:**`
