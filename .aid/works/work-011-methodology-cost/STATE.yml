  - id: Q37
    question: "Checked once more, as suggested. What did a DIFFERENT kind of check find?"
    status: Resolved
    answer: |
      Four defects, and the most serious of the whole session was among them. The change
      that found them was not looking in more places -- it was asking different questions:
      what has a second IMPLEMENTATION, and what points at the files this work DELETED?

      1. AC-12 WAS NOT MET BY THE WRITER THE DASHBOARD ACTUALLY USES.
         `dashboard/scripts/writeback-state.sh` is a deliberate fork, and the server's
         WRITER_DIR points at `dashboard/scripts`, so THAT fork performs every state write
         the UI triggers. Its is_flat_layout read BLUEPRINT.md presence alone. Since
         BLUEPRINT.md is retired, a work declaring `pipeline.path: lite` has none: every
         reader classified it FLAT while this writer classified it NESTED. The dashboard
         would read a work as flat and write to it as nested.

         It survived because the fork is legitimate on ONE axis (it accepts `Deploy` as a
         Phase value) and its own banner recorded that no parity suite compared it to its
         source -- naming the absence of that test as the real risk. The banner was right,
         and a banner is not a test. Fixed by LIFTING the canonical parser verbatim, because
         re-typing it would have required rediscovering all eight divergences that parser has
         produced. The corpus is now FOUR-way.

      2. A TEST PASSING ON A DELETED FILE. WS09 in test-work-state-template.sh grepped
         delivery-blueprint-template.md with `2>/dev/null`; on a missing file the grep returns
         non-zero, the else branch fires, and the assertion PASSES. Two assertions had been
         reporting success about a file that did not exist. Guarded now.

      3. DANGLING KB SOURCE CITATIONS. Three KB docs cited deleted templates in `sources:`.
         The gate whose name suggests it would catch this -- kb-citation-lint.sh -- flags
         volatile line-number anchors and never opens the cited path. AD14 does.

      4. docs/repository-structure.md still listed the retired template.

      Cleared, not defects: the vendored copies under packages/ are untracked and rebuilt by
      vendor.js/vendor.py, so the fix propagates; .aid-manifest.json names deleted templates
      as the historical record of past installs, which is its purpose.

      THE METHOD LESSON, which is worth more than the four fixes. Every earlier check asked
      "does this string appear somewhere else?" and so could only ever find more of the same
      class. These four were found by asking structural questions instead: does this logic
      have a second implementation, and what points at what I removed? The dashboard fork was
      invisible to every vocabulary scan because it contained no retired vocabulary at all --
      its defect was a MISSING read, and absence does not grep.

  - id: Q38
    question: "Asked whether to check once more. What did running the whole chain find?"
    status: Resolved
    answer: |
      The most serious defect of the session, and it exposed the previous round's fix as
      superficial.

      THE DASHBOARD COULD NOT WRITE TASK STATE AT ALL. `dashboard/scripts/writeback-state.sh`
      is what the server invokes for every write the UI triggers. It was a full generation
      behind: default target `.aid/works/work/STATE.md`, and its task write required a
      markdown `### Tasks lifecycle` SECTION. Against a current STATE.yml it does not write
      the wrong thing -- it writes NOTHING, failing with "malformed work STATE.md".

      Last round I ported the declared-layout read into that same file and recorded AC-12 as
      met. The file could not write to a STATE.yml regardless. Fixing a read in a writer that
      cannot write is a mistake only a whole-chain run reveals, and nothing ran the whole
      chain -- every mechanism had unit tests and every one passed.

      WHY IT SURVIVED: "deliberate fork" was read as "leave alone". A fork is exempt from
      RESYNC on its divergence, not from tracking its source everywhere else. When canonical's
      write path changed generation this copy needed that change, and the banner telling
      people not to resync it is precisely what persuaded everyone it did not. The banner also
      said no parity suite existed -- so the file documented its own risk twice and neither
      note was a test.

      Fixed by RE-FORKING from current canonical and re-applying the divergence, which is two
      lines. Re-applying two lines to a known-good file is verifiable; hand-porting a
      1700-line write path is not.

      test-lite-work-end-to-end.sh is the missing test. One current-shape Lite work --
      deliberately with NO BLUEPRINT.md, since that file used to BE the flat signal -- through
      slice, graph derivation, the FORKED writer, and both readers, requiring every stage to
      agree. Verified by restoring the old fork and watching it fail.

      MY OWN TEST WAS WRONG FIRST, and the slicer was right: it asserted "AC-3" appeared
      nowhere in the slice, but a feature section legitimately CITES all its criteria while
      section 9 defines only the cited ones. Now it asserts on definitions. Worth recording
      because I mistook a citation for a definition -- the exact confusion the ids-only rule
      exists to prevent.

      THE PATTERN, now five rounds deep and finally legible. Each round I checked the same
      WAY and found the same CLASS. What broke the streak both times was changing the kind of
      question: "does this logic have a second implementation?" found the fork, and "does the
      chain work when composed?" found that the fork was inert. Unit tests cannot see either
      -- one is about copies, the other about composition, and both are invisible to a suite
      that examines parts.

  - id: Q39
    question: "Review loop: iterate until only minor issues are found. Where did it stop, and on what evidence?"
    status: Resolved
    answer: |
      It stopped after three iterations, on the third returning nothing. The loop rule was
      that each iteration must ask a NEW KIND of question, because the five rounds before it
      established that repeating a kind of check only re-finds its class.

      ITERATION 1 -- two questions.
        "Do any tests assert on paths that do not exist?" One did: test-aid-remote.sh pointed
        at `dashboard/reader.py`, which moved into `dashboard/reader/`. Both uses were guarded
        with `[[ -f ]]`, so nothing broke and nothing warned; lines 96-102 already did the job
        correctly. Four dead lines. MINOR.
        "Do the other forks share the writeback fork's generational lag?" No. The connectors
        fork differs from canonical in one non-comment hunk -- an older `contracts:` metadata
        block -- out of the oracle's scope, no functional divergence. MINOR.

      ITERATION 2 -- "does the NESTED path compose?", having only ever composed Lite.
        It does. Different write target and different lane source, both correct. The one real
        finding was documentation in the reader I changed: its nested docstring named
        `deliveries/*/BLUEPRINT.md` as the task listing when discovery is directory-based, and
        both readers' flat docstrings still named BLUEPRINT.md as the delivery-title source.
        MINOR -- but the exact class this work exists to remove, sitting in its own output.
        The durable result is that the end-to-end suite now runs BOTH compositions.

      ITERATION 3 -- "does anything still PARSE what nothing WRITES?"
        Three leads, all resolved as correct: the delivery-gate parser's staleness is
        tracked as SY-3; `delivery_state` is read by Python and omitted by Node's serializer
        DELIBERATELY, for parity with server.py's serializer, so the SERVED payloads match.

      WHAT THE LOOP ALSO MEASURED, and the part worth keeping. Across iterations 2 and 3 I
      built four probes and three of them were wrong while the code was right: tasks live in
      the work-level union rather than on the DeliverableRef; nested lanes legitimately need
      the wave-map aid-detail writes; `delivery_state: In Progress` is outside the SD-8 enum
      and was correctly rejected. Earlier rounds had the opposite ratio -- the probe was right
      and the code was wrong. That inversion is the actual stopping signal: when the checks
      start failing against correct code more often than the code fails, the remaining yield
      is in the checks, not the system.

      STOPPING POSITION, stated honestly: three iterations of new-kind questions produced
      three minor issues, all fixed, and zero severe ones. That is not proof of correctness.
      It is the evidence the loop was asked for -- only minor issues are being found -- plus
      an admission that a fourth kind of question I have not thought of may still exist.

