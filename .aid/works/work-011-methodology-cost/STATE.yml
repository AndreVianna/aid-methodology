      not been fixed at all and would have shipped -- derive-waves streaming a partial
      unclosed fence on a cycle, two skills instructing a Revision History that the policy
      abolished, aid-define contradicting its own frontmatter, a dead feature.md template
      teaching the wrong criterion format, and a Unicode/ASCII split in the Source field
      between producer and consumer.

      This is the failure CLAUDE.md names in as many words, committed by the work whose
      subject is discipline. The mechanism is worth stating because it is not laziness:
      unmarked rows do not merely lose bookkeeping, they HIDE the genuinely open ones. Six
      real defects survived three passes inside a set of 27 rows that all looked equally
      unresolved. A ledger where everything says Pending carries the same information as no
      ledger.

      R3#12 adds a second lesson: it had been FIXED and was then REINTRODUCED by the
      work-006 merge, whose user-facing style was taken over this skill's body. Re-reading
