  - id: Q32
    question: "Items 9 and 11 -- the awk YAML parser and the transient-artifact rule. What did they turn out to be?"
    status: Resolved
    answer: |
      Item 9 was framed as "retire the hand-rolled awk parser for the shared engine".
      That is not available: there IS no shared bash engine -- nineteen scripts each
      hand-roll their own -- and the twins' engine is Python/Node, which a core-path
      script cannot assume. So the goal was reframed to the thing retirement was FOR:
      make a divergence impossible to ship.

      Probing scalar forms nobody had tried found eight disagreements out of twenty on
      the first attempt. Judged against a real YAML parser as oracle, five were bash
      bugs: a BOM in front of `pipeline:`, a `path:` nested two levels deep matching, the
      block/anchor markers `|` `>` `&p lite` being returned VERBATIM, an escaped quote
      truncating, and multi-document files taking the first document instead of the last.

      The block/anchor case is the instructive one. The harm is not the wrong value: a
      NON-EMPTY answer tells is_flat_layout the layout was declared, which suppresses the
      presence-rule fallback that would have classified correctly. Junk is worse than
      silence precisely because it looks like an answer.

      The indent rule is now exactly two spaces, matching the engine's `level = indent //
      2`. Worth being explicit that this makes all three agree while all three differ
      from a full YAML parser, which reads four-space nesting as an ordinary child. That
      is what a documented SUBSET is, and cross-reader consistency is the invariant that
      matters -- a file all three misread identically is classified identically.

      Item 11 named the form of work-folder dependency the rule cannot see: a constant
      measured from a work folder and hardcoded. It survives pruning and loses not
      correctness but checkability. Applying it here found four of five cost-meter
      constants already compliant and one, CODE_PER_TASK, with no provenance at all.

      That one is not honestly measurable, so it is labelled ASSUMED and discharged by
      showing no conclusion rests on it. Writing that test corrected the comment: the
      first version claimed the term cancels everywhere and CM43 failed, correctly. It
      does not -- `today` charges no code term at its delivery gate while the other four
      shapes do. The surviving claim is weaker and true.

      Both items share a shape worth keeping: the stated goal ("retire the parser",
      "state the rule") was not the achievable one, and in both cases the test written to
      confirm the work contradicted the description of it. A corpus that grows only by
      recording failures already found is the coverage that cannot be credited.

  - id: Q33
    question: "Asked directly what is missing and what the problem is. What did the audit find?"
    status: Resolved
    answer: |
      Two problems, both found by checking rather than recalling. All 14 acceptance
      criteria verify clean, so neither was a criterion failure -- which is the point:
      the criteria did not cover either.

      ONE: `canonical/agents/` was never swept. Every prose sweep in this work targeted
      `canonical/skills/` and `canonical/aid/templates/` -- the places artifacts are USED.
      An agent definition is neither, and it is where an agent is told what to PRODUCE,
      which makes a stale name there worse than the same name in a reference doc.
      aid-architect -- the agent that performs the decomposition -- instructed itself to
      write `task-NNN.md` plus "an execution graph in PLAN.md", both retired, and pointed
      PLAN.md at a template directory containing no plan template (there is none anywhere;
      aid-plan defines that shape inline). Eight references across five agents wrote work
      state to `STATE.md` with markdown section names that do not exist in a YAML file.
      Fixed, and gated by AD12 in three arms.

      AD12's shape is the part worth keeping: the state arm matches the WORK state file
      specifically rather than banning `STATE.md`, because `.aid/knowledge/STATE.md` is
      the KB's own file, still markdown and still correct in five places. A blanket ban
      would have "fixed" those into being wrong. AD12b asserts those five SURVIVE, so an
      over-broad tightening fails at the gate instead of shipping a confident wrong
      correction -- and it was verified by committing that exact over-correction.

      TWO: the savings are modelled, never observed. Measured against its own merge-base,
      this branch moves the static instruction surface by -0.16% -- essentially flat.
      Every claimed gain sits in a priced model with an assumed dispatch shape and assumed
      cycle counts. That is defensible, because the gate cost genuinely dominates (millions
      of bytes per run against tens of thousands static), but it is not the same as having
      watched a real run get cheaper, and nothing here has.

      Related and now fixed: the committed baseline recorded 75 skills against a tree of
      111, so its advisory printed 173 rows of already-accepted growth. A stale baseline
      does not raise a false alarm, it raises a useless one. Refreshed; the accepted delta
      is +2,113,710 chars, predominantly work-006's design family.

      The honest remaining gap is the second problem. An end-to-end run measured before
      and after would convert the central claim from modelled to observed, and no artifact
      in this work does that.

  - id: Q34
    question: "Close-out: what remained, and why is tasks_lifecycle empty?"
    status: Resolved
    answer: |
      Three things remained, and the first was the one that mattered.

      THE REVIEW LEDGERS WERE NEVER CLOSED. All 27 rows across R1/R2/R3 still read
