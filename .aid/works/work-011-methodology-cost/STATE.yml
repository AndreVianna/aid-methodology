  - id: Q15
    question: 'Why was the branch carrying 247 file-mode changes nobody asked for?'
    state: Resolved
    answer: |
      Because run_generator.py chmods every emitted .sh to 755, and this container had
      core.fileMode=true while the origin repo sets it FALSE. Upstream therefore never
      sees the churn -- test-release.sh documents the setting and mirrors it into its
      clones for precisely this reason -- but here every render staged a 644 -> 755 mode
      change, and `git add -A profiles/` committed them. 245 under profiles/, one on a
      test suite, three renders in a row, entirely unnoticed.

      Normalized to 644 via update-index --chmod=-x, matching origin/master exactly:
      247 files, 0 insertions, 0 deletions. test-artifact-discipline.sh went to 644 too,
      since all 140 existing suites are 644 in the index and it was the outlier at 755;
      the exec bit was never load-bearing, as every suite is invoked as `bash <path>`.
      core.fileMode is now false locally, and a re-run of the generator plus dogfood sync
      reports 0 changed files where it previously dirtied 177.

      Two things this is worth recording for: a PR carrying hundreds of mode-only entries
      does not merely add noise, it HIDES the reviewable change among them. And the local
      environment differed from the project's assumed setup in a way no test could catch,
      because the setting that masks it is configuration, not code -- the reason it
      surfaced at all is that a push check listed the working tree instead of assuming it
      was clean.
    decided_by: agent
    updated: '2026-08-15'
  - id: Q14
    question: 'Did the prose sweep break anything, and how would we know?'
    state: Resolved
    answer: |
      It broke one thing, and the way it was caught is the point.

      Renaming aid-plan's `### Check 2: Verify Feature SPECs` to `Verify Features` broke
      the anchor test-downstream-worktree-entry.sh asserts against. Found by running the
      WHOLE corpus against origin/master in a throwaway worktree and diffing the failure
      sets: 16 suites fail on this branch, 15 of them fail on master too for want of gawk
      and pwsh, and exactly one failed only here. Without the master baseline that one
      regression would have been indistinguishable from the 15 standing environment
      failures -- which is how a real break hides in a container that cannot run
      everything.

      Fixing the anchor exposed the underlying defect (item 10's first half, pulled
      forward). assert_pointer_before and assert_strict_between appended matched LINE
      NUMBERS to the pass message, and coverage-parity keys on the whole label, so any
      unrelated edit that shifted a line minted a new key and read as coverage REMOVED.
      The allowlist row already in the tree proved the cost: its target claimed
      101 < 111 while the tree had drifted to 114 < 124, so the excuse it existed to
      grant no longer matched anything. Stale on arrival.

      Line numbers are evidence, not identity. Both helpers now send them to the verbose
      stream. Six one-time re-home rows cover the re-key, each verified against the labels
      the suite actually emits -- a rehome naming an absent target fails the gate as
      "claimed but not landed", exactly as the stale row would have.

      Corpus now: 15 failing, all 15 failing on master too. No branch-introduced failure.
    decided_by: agent
    updated: '2026-08-15'
  - id: Q11
    question: 'R2 review: do the three layout implementations actually agree?'
    state: Resolved
    answer: |
      They did not. Three scalar forms made bash disagree with Python and Node on the
      SAME file -- all reproduced, all now fixed, all now regression-tested.

        CRLF          awk's `$` anchors sat behind a stray \r, so `pipeline:` never
                      matched and the value read empty
        'lite'        only double quotes were stripped, so the value compared as
                      "'lite'" and never equalled "lite"
        lite # note   the inline comment was kept verbatim

      Each made a work DECLARED lite fall through to the presence rule and be
      classified full -- silently, since every branch returns a value.

      Root cause is structural, and worth stating plainly: the twins delegate to the
      shared D-3 subset engine, while this one hand-rolls YAML in awk. Every scalar
      form the engine accepts has to be re-implemented by hand or the three drift.
      Three of them were missed on the first pass. The fix closes these three; it does
      not remove the structural hazard, which is inherent to parsing YAML three times
      in three languages. Retiring the awk parser in favour of a shared helper is the
      real remedy and is not attempted here.

      Fixed alongside: bash fell back to STATE.md where both twins deliberately do not
      (SP-9 diagnoses legacy works rather than parsing them), and two docstrings had
      outlived their code.

      Parity now verified on 12 fixtures across all three implementations, including a
      quoted 'a # b' where the hash must stay literal. One apparent fourth divergence
      was my own harness bypassing the twins' string type-guard, not a real defect --
      checked before reporting it.
    decided_by: agent
    updated: '2026-08-15'
  - id: Q12
    question: 'Why did three parser bugs survive a 278-assertion suite?'
    state: Resolved
    answer: |
      Because nothing tested the declared read as the SIGNAL. This is the most useful
      thing the review produced, above any individual bug.

      Units 20-25 all ship a BLUEPRINT.md, so every existing flat fixture satisfied the
      PRESENCE rule. All of them pass with the declared read entirely broken. The one
      test naming pipeline.path (test-writeback-state.sh:1658) asserts that --pipeline
      WRITES the key -- never that reading it drives dispatch. So the change that is the
      whole point of Q4, and the thing that unblocks AC-12 and AC-13, had 278 assertions
      around it and zero on its actual purpose.

      The general lesson, which generalizes past this work: a test that keeps the OLD
      signal present cannot detect that the NEW signal is dead. Replacing a signal means
      building fixtures that carry only the new one.

      Closed by Unit 26: seven cases, every fixture carrying NO BLUEPRINT.md, so only the
      declared read can produce a flat dispatch. Includes the inverse -- declared full
      must beat a PRESENT BLUEPRINT.md -- which is what proves the others are not passing
      by accident, plus an undeclared case pinning the fallback for un-migrated works.
      Verified to fail exactly 6 assertions against the pre-fix parser and pass 389/389
      with it, because a test that cannot fail is not evidence.
    decided_by: agent
    updated: '2026-08-15'
