      defined for the flat shape". Every flat task was laneless. So this ADDS information
      the layout never had, and removing its PLAN.md now costs the readers nothing.

      An AUTHORED map still wins where one exists; the derivation only fills an empty
      one. An explicit statement should not be overridden by an inference.

      There are now THREE implementations of one sort (awk, Python, Node) -- the exact
      shape that produced three silent divergences earlier in this work. So the parity
      test has two legs, because agreement between the two PORTS would prove only that
      they match each other, not that either matches the reference: one leg compares the
      twins, the other runs the real derive-waves.sh over a generated work. Both legs
      were verified by breaking each side deliberately -- dropping the foreign-dependency
      rule from Node is caught by the first, an off-by-one join in Python by the second.

      18 fixtures target what a port is most likely to drop: a dependency outside the set
      is already SATISFIED (deliveries run in series; treating it as unsatisfiable
      reports a cycle that does not exist), a self-edge is discarded rather than
      deadlocking, a cycle yields {} rather than a partial map that would read as a
      problem with the TASKS, a diamond join lands one wave after BOTH parents, every
      "no dependencies" spelling agrees, and declaration order does not change the answer.

      One test INVERTED, not deleted: test_reader.py asserted lane=None for a flat task,
      correct only because the derivation did not exist. lane=None would now mean the
      derivation silently did nothing.

