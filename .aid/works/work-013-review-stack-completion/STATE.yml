# [A]
#   Raised by aid-architect during FEATURE-DECOMPOSITION. The owner approved the
#   decomposition as-is with these open, so they are recorded here rather than
#   fixed: each one lands on a task in the feature named under applied_to.
qa:
  - id: Q1
    category: Requirements
    impact: High
    state: Answered
    context: >-
      AC-11 says "`git diff` on both is empty". With no ref, `git diff` reports the
      WORKING-TREE diff, which is empty after any commit no matter what changed, so the
      criterion passes even if both files were rewritten and committed. Measured on this
      branch: `git diff --stat -- canonical/aid/scripts/grade.sh
      canonical/aid/templates/reviewer-ledger-schema.md` returns 0 lines.
    suggested: >-
      Give it a base ref, e.g. `git diff master...HEAD -- canonical/aid/scripts/grade.sh
      canonical/aid/templates/reviewer-ledger-schema.md`, and drop the "is empty, OR the
      diff touches neither" disjunction — only the second half means anything.
    answer: >-
      Accepted 2026-08-17 (owner, option 2). AC-11's base is the WORK'S OWN BASE COMMIT -- the
      branch tip recorded before the first edit -- not `master`, which moves and would silently
      re-scope the criterion whenever someone else merges. The "diff is empty" disjunct is
      dropped; the only reading is that the diff touches neither counting logic nor column
      shape. All three feature SPECs and both delivery BLUEPRINTs already state it this way, so
      what this answer settles is the requirement text.
    applied_to: 'all three features (AC-11 is carried by each)'
  - id: Q2
    category: Requirements
    impact: High
    state: Answered
    context: >-
      AC-7's command returns 97 lines today (canonical 16, tests 3, docs 1, site/src 74,
      .aid/knowledge 3). The site/src bulk is generated skill-flow JSON, and 34 of those
      files still embed an authoring instruction that no longer exists in canonical
      (`grep -rn 'Initial capture (shortcut' canonical` returns 0) — a stale generated
      mirror. AC-7 therefore puts a generated tree in scope while NFR-2 forbids editing
      one, and it greps neither `## Revision History` nor `changelog:` though FR-B7
      forbids both.
    suggested: >-
      Replace the command with one that tests what FR-B7 says and excludes generated
      trees, and regenerate the site data rather than editing it.
    answer: >-
      Answered 2026-08-17 (owner, option 3), and it is STRONGER than the suggestion. A change log
      is a section that must be excluded and not considered anymore: remove every `## Change Log`
      section from EVERY file, fixtures included. Test fixtures are not carved out -- a fixture
      that models a retired artifact shape teaches the shape. Generated trees are still
      regenerated rather than hand-edited (NFR-2), so the source is fixed and the render follows.
    applied_to: 'feature-002-coverage-gate-completion'
  - id: Q3
    category: Requirements
    impact: Medium
    state: Answered
    context: >-
      FR-B3 calls the kb.html content review "a deliberate, named exception to KB-03".
      KB-03 applies to registry type `kb-generated`, whose match is
      `path .aid/knowledge/*.md AND fm source == generated`. `kb.html` is HTML, so it
      resolves to no registry type at all — it is outside the cascade, not excluded by
      it. Implementing FR-B3 means ADDING a document type plus criteria, which is a
      different and larger change than an exception.
    suggested: 'Restate FR-B3 as adding a registry type for the generated summary.'
    answer: >-
      Accepted 2026-08-17 (owner, option 2): a STANDALONE check, outside the criteria registry.
      The registry stays markdown-only, so `G-07`'s "every in-scope markdown file resolves to
      exactly one type" needs no rewording and its partition claim is untouched. FR-B3 is
      therefore not an exception to `KB-03` -- `KB-03` never reaches `kb.html`, which is HTML --
      it is a check that lives beside the cascade. Same outcome, materially smaller blast radius:
      no registry type, no `G-07` edit, no new criterion id.
    applied_to: 'feature-002-coverage-gate-completion'
  - id: Q4
    category: Requirements
    impact: Medium
    state: Answered
    context: >-
      FR-B7 says the rule is "stated once (artifact-schemas.md)". It is stated twice
      inside that file alone (lines 252 and 629-630) and at ~20 sites overall, including
      criterion KB-02, the kb-authoring principles and tier-model, design-lifecycle, the
      requirements template, the work-state template, docs/aid-methodology.md, six skill
      C-3 bullets and three test assertions. Reducing that to one is a deletion across
      the cascade, the docs site and the test suite, and §4 In Scope does not mention it.
    suggested: >-
      Restate as "stated NORMATIVELY once, cross-referenced elsewhere", or add the
      deletion to scope.
    answer: >-
      Accepted 2026-08-17 (owner, option 2), with the owner's own framing: "I don't care how many
      times it is written as long as it is followed." FR-B7 is reworded to require the rule be
      stated NORMATIVELY once -- artifact-schemas.md is the normative home -- and cross-referenced
      freely everywhere else. Repetition is not the defect: most of the ~20 sites are ENFORCEMENT,
      and a test that asserts the rule or a template that must not emit one has to mention it.
      Deleting them would remove the teeth rather than the drift. What FR-B7 forbids is a second
      site CONTRADICTING the normative one, which is a conformance check, not a deletion job.
    applied_to: 'feature-002-coverage-gate-completion'
  - id: Q5
    category: Requirements
    impact: Medium
    state: Answered
    context: >-
      FR-B6 (one grading backend) and NFR-1 (do not change grade.sh counting logic) pull
      against each other. `grade-summary.sh` is a points grader with its own
      `letter_grade()` over two pools; making grade.sh the sole letter producer needs
      either converting the summarize path to a 7-column ledger (not in §4) or teaching
      grade.sh a points mode (NFR-1 forbids it). FR-B6 is SHOULD, so this is survivable,
      but it needs deciding before planning rather than discovering mid-task.
    suggested: 'Owner decides: convert the summarize path, or drop FR-B6.'
    answer: >-
      Accepted 2026-08-17 (owner, option 2): FR-B6 is DECLINED, and recorded as declined by owner
      decision rather than silently skipped. It is a SHOULD, so declining is a legitimate
      discharge. Two reasons, both measured: the V1 human visual gate can force `F`
      (grade-summary.sh "mandatory gate") and `grade.sh` cannot emit `F` at all
      (`grep -c 'GRADE="F"' canonical/aid/scripts/grade.sh` -> 0), so unifying the backends needs
      a design decision about how that verdict is expressed -- a CRITICAL ledger row, which
      grade.sh renders as `E+/-`, or a precondition that blocks before grading. And
      `grade-summary.sh` has ten dependents including tests/coverage-baseline.tsv. Neither is in
      this work's scope. delivery-001's SHOULD gate criterion is therefore discharged as
      "declined, recorded", and the two-backend state is left as it is.
    applied_to: 'feature-002-coverage-gate-completion'
  - id: Q6
    category: Requirements
    impact: Medium
    state: Answered
    context: >-
      FR-B4 names a "specify per-section review" that does not exist — `grep -rn
      'per-section' canonical` returns 4 hits, none a review mechanism. aid-specify
      reviews PER FEATURE and that review is already on the required path
      (`aid-specify/references/state-review.md` runs grade.sh on the ledger). So half of
      FR-B4 is already satisfied and the other half names something unbuilt and unscoped.
      BLUEPRINT.md is the genuine gap: its template declares no ledger path.
    suggested: 'Narrow FR-B4 to BLUEPRINT.md, or define what a per-section review is.'
    answer: >-
      Accepted 2026-08-17 (owner, option 2): FR-B4 is NARROWED to BLUEPRINT.md. Nothing named
      "per-section" is a review mechanism -- `grep -rniE 'per-section|per section' canonical
      --include=*.md` returns 5 hits, four about aid-summarize HTML sections and one a heading in
      aid-specify's own loop -- and the specify review is already per FEATURE on the required
      path (aid-specify/references/state-review.md runs grade.sh --explain on
      review-pending/specify-<feature>.md). So the specify half of FR-B4 is already satisfied and
      needs no work; the genuine gap is BLUEPRINT.md, whose template declares no ledger path at
      all. Defining a per-section mechanism would mean inventing machinery to satisfy a phrase.
    applied_to: 'feature-002-coverage-gate-completion'
  - id: Q7
    category: Requirements
    impact: Low
    state: Answered
    context: >-
      AC-8's `*review*` glob can be evaded by naming: a second review system called
      `aid-screener`, `aid-critique` or `aid-audit` satisfies the glob while being exactly
      what FR-A1 forbids — and §4 Out of Scope names aid-screener specifically. Both
      halves already pass on this branch, so AC-8 is a regression guard rather than a
      change.
    suggested: 'Make the FR-A5 audit command the real guard and have AC-8 say so.'
    answer: >-
      Accepted 2026-08-17 (owner, option 2): the FR-A5 audit is the real guard, and AC-8 says so
      rather than resting on the glob. The glob is evadable by naming -- a second review system
      called `aid-screener`, `aid-critique` or `aid-audit` satisfies `ls -d canonical/skills/*review*/`
      while being exactly what FR-A1 forbids, and §4 Out of Scope names `aid-screener` by name.
      Demonstrated on the canceled branch: the agents glob returns 1 and PASSES while
      `aid-screener/AGENT.md` sits in the added-files list. The audit's lexicon layer covers the
      review family (review, reviewer, screener, critique, audit, inspect, verif, grade, rubric)
      outside the sanctioned pair, so it catches the rename the glob cannot. The two `ls` commands
      stay as a cheap regression guard; they are no longer the whole test.
    applied_to: 'feature-001-single-review-path-alignment'
  - id: Q8
    category: Requirements
    impact: Low
    state: Answered
    context: >-
      AC-9 says "Measured by READING that cycle's ledger", while NFR-4 requires a count to
      cite the command that produced it. A read is not a command.
    suggested: >-
      Give AC-9 a grep that yields the row count and the count of rows carrying a
      why-line.
    answer: >-
      Accepted 2026-08-17 (owner, option 2): BOTH, with the limit stated. AC-9 gains a command
      that reports the ledger's row count and how many rows carry a why-line, satisfying NFR-4;
      and the rows the command flags are then READ, because a grep can prove a why-line's shape
      and never whether its clause names a real consequence. The command is the coverage check,
      the reading is the substance check, and AC-9 says which is which so neither is mistaken for
      the other. A why-line is the clause on a finding that names what breaks -- without it a
      severity cannot be argued with, and since the grade is computed from severities, an
      unarguable severity makes an unarguable grade.
    applied_to: 'feature-003-severity-and-recall-measurement'
  - id: Q9
    category: Requirements
    impact: Low
    state: Answered
    context: >-
      FR-C3 and FR-C6 reach no criterion in §9, so both are unverifiable as written. Both
      are SHOULD, so §9's "an uncovered MUST is visible" claim still holds literally.
      Criteria were synthesized for both in feature-003, inheriting SHOULD.
    suggested: 'Confirm the synthesized criteria, or drop the two requirements.'
    answer: >-
      Answered 2026-08-17 (owner): ADD the acceptance criteria rather than dropping the
      requirements. FR-C3 and FR-C6 reached no criterion in §9, so nothing verified them. The two
      criteria feature-003 synthesized are confirmed and promoted into §9 as AC-13 and AC-14,
      each inheriting its source requirement's SHOULD. §9's Discharges column now names every FR
      and NFR, so the section's own claim -- that an uncovered requirement is visible -- holds
      for SHOULD as well as MUST, not only literally.
    applied_to: 'feature-003-severity-and-recall-measurement'
  - id: Q10
    category: Requirements
    impact: Low
    state: Answered
    context: >-
      Raised by aid-reviewer at cross-reference cycle 1. NFR-5 has three components --
      VERIFY/HUNT remains mandatory, brief rendered to disk, cost meter recorded -- and
      §9 AC-2 verified only the second and third, so the first was carried by no
