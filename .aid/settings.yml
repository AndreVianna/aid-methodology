# Floor history: A+ -> B- (owner decision, 2026-07-30, work-001 delivery-006's gate)
# -> A (owner decision, 2026-08-04, work-004's closing pass). The middle value is retained
# below because the reason it existed is the reason A -- and not A+ -- is the right end state.
#
# Why NOT A+. A+ means "zero issues at ANY severity" (grading-rubric.md). On artifacts that are
# largely prose, that surface is effectively unbounded: five consecutive Large-tier gate cycles
# on delivery-006 each closed ~12 findings and opened ~12, so the ledger grew 30 -> 43 -> 62
# -> 73 -> 85 with no decline in the new-finding rate. An A+ gate there was not a bar being
# approached, it was a loop that does not terminate.
#
# Why B- was too low to keep. B- = "the worst SURVIVING finding must be LOW". CRITICAL, HIGH
# and MEDIUM stayed fully blocking throughout, so nothing that misinformed a reader or broke a
# build was ever waived. What B- bought was that LOW/MINOR findings stopped blocking a gate from
# closing -- they were batched and cleared at the END of a work instead of being re-litigated
# every cycle, which is where that five-cycle loop had been spending itself. That batching
# worked: work-004 closed its three deliveries at B+/B-/B and then cleared 14 deferred findings
# in one pass. But it leaves LOW defects live in the tree for the whole work, and some of them
# are not cosmetic -- that pass found an exhausted marker budget that would have failed the next
# author's build, and a stale count with a second instance no ledger had named.
#
# Why A. A = "MINOR only may survive". LOW and above all block, so a real defect cannot be
# deferred past a gate; MINOR may remain, which is exactly where the non-terminating nit loop
# lived (stale file:line citations, wording, anchors that drift when a sibling edits a file).
# A keeps the property that made B- terminate while restoring the property that made A+ worth
# wanting. If a gate at A starts showing the delivery-006 signature -- findings closing and
# reopening at a flat rate across cycles -- that is evidence the bar is wrong for that artifact
# class, not a reason to grind; escalate to the owner rather than looping.

