# Delivery State -- delivery-NNN   (single writer: this delivery's branch)
#
# This is the DELIVERY-LEVEL STATE.yml template -- FULL PATH ONLY. It lives at
# .aid/works/work-NNN-{name}/deliveries/delivery-NNN/STATE.yml. (A lite work
# has exactly one delivery and no deliveries/ folder at all -- its Delivery
# Lifecycle / Delivery Gate are AUTHORED directly in the
# work-root STATE.yml instead; see work-state-template.yml.) It is divided
# into three zones:
#   FRONTMATTER (single writer = this delivery's branch, machine-parsed
#     scalars) -- delivery_state, gate_tier, gate_grade, gate_timestamp
#     (top-level keys, verbatim).
#   AUTHORED (single writer = this delivery's branch, YAML structures under a
#     key) -- delivery_lifecycle (Updated/Block Reason/Block Artifact),
#     delivery_gate (Issue List). `qa` is kept empty: no question is written here.
#   DERIVED (read-only, assembled at read time) -- Tasks State (rollup from
#     per-task STATE.yml files in tasks/task-NNN/STATE.yml). NOT represented
#     here -- no key at all.
# Identifiers (Delivery / Work in the header blockquote, Branch) are INFERRED
# from the folder name and git worktree -- never authored here.
#
# DELIVERY LIFECYCLE ENUM (authored, not derived)
#
# The delivery's lifecycle state is INDEPENDENTLY AUTHORED across the
# pipeline:
#   aid-plan       creates this file with State = Pending-Spec
#   aid-specify    advances to Specified
#   aid-execute    advances Specified -> Executing -> Gated (gate running) -> Done
#                  or to Blocked on an impediment
#
# Enum members:
#   Pending-Spec   -- delivery folder created; awaiting aid-specify
#   Specified      -- aid-specify complete; tasks defined
#   Executing      -- aid-execute in progress (at least one task dispatched)
#   Gated          -- delivery gate running
#   Done           -- gate passed; delivery complete
#   Blocked        -- impediment raised; awaiting resolution
#
# NOTE: This authored state is NOT a derivation of child task states. A
# delivery may be Pending-Spec with ZERO tasks (e.g. a SPIKE delivery that
# defines a sibling delivery which then waits for aid-specify). A pure
# task-rollup cannot express a task-less in-flight delivery, so the delivery
# lifecycle MUST be independently authored.

# [W] Pending-Spec | Specified | Executing | Gated | Done | Blocked
delivery_state: Pending-Spec
# [W] Small | Medium | Large
gate_tier: Small
# [W]
gate_grade: Pending
# [W]
gate_timestamp: --
# [A] single writer: this delivery's branch only. Written by aid-plan,
#     aid-specify, aid-execute across the delivery pipeline. Never derived
#     from task rollup. `updated` is a writer-targeted child key (L-2).
delivery_lifecycle:
  updated: '2026-01-01T00:00:00Z'
  block_reason: --
  block_artifact: --
# [A] single writer: the delivery-gate closing step of aid-execute on this
#     delivery's branch. Written via `writeback-state.sh --delivery-id NNN
#     --block ...`. Distinct from per-task quick-check findings -- the gate
#     aggregates those deferred [HIGH] rows (via delivery-NNN-issues.md; see
#     canonical/aid/templates/delivery-issues.md) and runs a full grade.sh
#     pass. `issue_list` is a writer-targeted child key (--append-issue, L-2).
#   issue_list: severity-tagged strings, or [] when the gate passed clean
delivery_gate:
  issue_list: []
# [A] `qa` (the delivery-level Cross-phase Q&A) is retired as a question home: no question is written here. Every question
#     asked while working on a work, the delivery-gate SPEC question included, is recorded in the
#     WORK's STATE.yml `qa` list with `writeback-state.sh --ask` (question-protocol.md § Where each
#     record lives), and the work's resume asks it. KB questions target .aid/knowledge/STATE.md.
qa: []
# DERIVED: tasks rollup is a read-time union over tasks/task-NNN/STATE.yml. Not represented.
