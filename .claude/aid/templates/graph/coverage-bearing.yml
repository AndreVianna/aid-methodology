# aid/templates/graph/coverage-bearing.yml
#
# The coverage-bearing subset of the relation vocabulary (feature-006,
# work-005-knowledge-graph). A source artifact is "covered" when a Knowledge Base
# node reaches it through one of the relations listed below; an artifact reached by
# no such relation is what `/aid-graph`'s Knowledge Base gap ledger reports.
#
# Sibling of `relation-vocabulary.yml` in this directory, deliberately, so that a
# reviewer reads the selection beside the vocabulary it selects from. It is NOT a
# third top-level key inside that file: the vocabulary loader's forward pass
# recognises only its own two top-level keys, and a third would change a settled
# loader contract to buy an adjacency this file already provides.
#
# Renders as VERBATIM BYTES to `<root>/aid/templates/graph/coverage-bearing.yml`
# in every profile -- a `.yml` is not in render.py's `_TEXT_EXTENSIONS`, matching
# the shipped `templates/shortcut-catalog.yml` precedent.
#
# ---------------------------------------------------------------------------
# NOTHING READS THIS FILE AT RUNTIME
# ---------------------------------------------------------------------------
#
# This is the reviewable copy, and it needs no loader. The executable copy is the
# `COVERAGE_BEARING` constant inside `aid/scripts/graph/coverage-predicate.mjs`,
# which imports nothing, and feature-007's GV04 asserts that the constant and the
# `coverage_bearing:` sequence below are equal. Editing this file alone therefore
# changes no behaviour -- it changes a test's verdict. Edit both, always.
#
# ---------------------------------------------------------------------------
# Field contract
# ---------------------------------------------------------------------------
#
#   coverage_bearing  (required, block sequence of plain relation tokens, one per
#                     physical line) -- each token is the `relation` key of a pair
#                     declared in `relation-vocabulary.yml`. Membership is by
#                     `relation` key only: never by `inverse`, and never by
#                     category.
#
# ---------------------------------------------------------------------------
# The criterion -- stated before the verdicts, so the verdicts can be checked
# against it rather than taken on trust
# ---------------------------------------------------------------------------
#
# A pair is coverage-bearing iff, read in the Knowledge Base -> artifact direction,
# its authored `definition` asserts at least one of these three things about the
# artifact:
#
#   (a) aboutness             the Knowledge Base endpoint is a record OF the
#                             artifact;
#   (b) citation as support   the Knowledge Base endpoint names the artifact as
#                             something a reader can consult, or check a claim
#                             against;
#   (c) derivation            the Knowledge Base endpoint's content came FROM the
#                             artifact.
#
# Anything less is co-location, and co-location is exactly the defect the ledger
# exists to surface.
#
# The selection is made at PAIR granularity, not at category granularity. Both
# `documentation` and `annotation` contain a pair whose own definition disclaims
# coverage, so admitting a category wholesale would make the ledger under-report by
# construction: a category is a shortlist, a pair is a decision.
#
# ---------------------------------------------------------------------------
# The verdicts -- the candidate universe, enumerated and not sampled
# ---------------------------------------------------------------------------
#
# Every vocabulary pair whose `endpoint_kinds` carries a token joining a Knowledge
# Base kind to `source-artifact`, in either reading. `implements`, `tests` and
# `exemplifies` reach a Knowledge Base -> artifact reading only through their
# `inverse`; every other row below is authored in that direction already.
#
#   member    documents          documentation   (a) an authored record of the
#                                                target, written by drawing on it
#   member    cites              evidence        (b) names the target as a
#                                                reference a reader may consult
#   member    cites-as-evidence  evidence        (b) in its strongest form: the
#                                                checkable support for one claim
#   member    derived-from       provenance      (c) the source's content came
#                                                from the target
#
#   excluded  mentions           documentation   its own definition disclaims both
#                                                (a) and (b)
#   excluded  generated-by       provenance      direction of account: an output OF
#                                                an artifact describes nothing
#   excluded  quotes             provenance      a verbatim fragment asserts
#                                                nothing about the whole
#   excluded  has-member         structure       enrolment in a declared set is
#                                                co-location
#   excluded  renders-to         representation  a format sibling, not a record
#   excluded  annotates          annotation      disclaims (a) explicitly, and is
#                                                reachable by reading alone
#   excluded  implements         implementation  the one exclusion with a live case
#                                                against it: the Knowledge Base ->
#                                                artifact reading is the pair's
#                                                INVERSE name, and it has no
#                                                deterministic producer today
#   excluded  tests              implementation  same inverse-direction constraint,
#                                                weaker semantic case
#   excluded  exemplifies        definition      same constraint, and co-location
#                                                seen from the artifact's side
#
# ---------------------------------------------------------------------------
# Changing the selection
# ---------------------------------------------------------------------------
#
#   1. Re-derive from the criterion above. If the vocabulary renames or drops a
#      member, do not patch this list to match -- decide the renamed pair against
#      (a), (b) and (c) again.
#   2. Change `coverage-predicate.mjs`'s `COVERAGE_BEARING` in the same edit, or
#      GV04 fails.
#   3. A project extension cannot widen this set. An artifact covered only by an
#      extension pair is reported as a gap it is not; the detector counts the rows
#      typed outside the core vocabulary so that blind spot is measurable on a real
#      project rather than merely described.
#   4. Run the FULL profile generator (never a partial render) so every profile
#      copy and its emission manifest move together.
#   5. Submit through the project's normal review gate (reviewer ledger at
#      .aid/.temp/review-pending/<scope>.md, graded by grade.sh).
#
# ---------------------------------------------------------------------------

coverage_bearing:
  - documents
  - cites
  - cites-as-evidence
  - derived-from
