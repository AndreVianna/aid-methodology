# aid/templates/graph/edge-relation-map.yml
#
# Binds each of Pass 1's harvest kinds to the relation the row it produces carries
# (feature-005, work-005-knowledge-graph).
#
# A harvest kind is the extraction feature's own concept -- the name of a thing a
# scanner found. The relation vocabulary cannot name scanner outputs without
# knowing about the scanners, and should not, so the binding lives in this file
# rather than as a field of `relation-vocabulary.yml`. The consequence worth
# stating: no relation label appears anywhere in the extraction scripts. They read
# this map, and the map is checked against the vocabulary at load time.
#
# Renders as VERBATIM BYTES to `<root>/aid/templates/graph/edge-relation-map.yml`
# in every profile -- a `.yml` is not in render.py's `_TEXT_EXTENSIONS`, matching
# the shipped `templates/shortcut-catalog.yml` precedent.
#
# ---------------------------------------------------------------------------
# Entry grammar -- four `|`-separated fields, one entry per physical line
# ---------------------------------------------------------------------------
#
#   <harvest-kind>|<emitting-provenances>|<kind-pairs>|<relation-label>
#
#   1  harvest kind          the scanner output this entry types. A kind appears at
#                            most once; the closed list of kinds the extractor
#                            recognises lives in the loader, not here.
#
#   2  emitting provenances  comma-separated values from `relationship-schema.yml`'s
#                            `provenance:` enum -- which passes may emit this kind.
#
#   3  kind pairs            comma-separated `<source-kind>-><target-kind>` tokens,
#                            each side a name in `relationship-schema.yml`'s
#                            `kinds:` list. The endpoints this harvest may join.
#                            Field 3 carries KIND names and never id prefixes; a
#                            token naming a prefix is a defect rather than a
#                            tolerated legacy form.
#
#   4  relation label        the `relation` key the emitted row's `S2T Relation`
#                            carries. The `T2S Relation` is never chosen here: it
#                            is looked up as that entry's `inverse`, so every row
#                            this map produces is an internally consistent pair by
#                            construction.
#
# No field may be empty, and no space surrounds a separator. Comma is the only
# separator inside fields 2 and 3 -- one separator for a multi-valued field is one
# fewer thing to get wrong.
#
# ---------------------------------------------------------------------------
# Load-time gates
# ---------------------------------------------------------------------------
#
# `load_edge_relation_map` runs fail-closed, before any row exists, and checks this
# file against the merged core-plus-extension vocabulary: entry arity, completeness
# over the loader's closed harvest-kind list, membership of field 4, pass legality
# of field 2 against that relation's `passes`, and endpoint legality of field 3
# against its `endpoint_kinds` -- compared after parsing, never textually, because
# this file's encoding and the vocabulary's flow sequence are two notations for one
# token set. Each gate is specified once, in feature-005's contract, and is not
# restated here.
#
# ---------------------------------------------------------------------------
# One harvest kind is deliberately unmapped
# ---------------------------------------------------------------------------
#
# `path-reference` -- the coarse "one node's bytes contain another node's path or
# uniquely-resolving basename" observation -- has no entry below. The relation
# whose definition matches it declares no `source-artifact->` endpoint at all, and
# inventing a mapping would assert a data dependency the observation does not
# evidence; the endpoint gate would reject it in any case. Those observations
# become Pass-2 edge candidates instead. The loader carries `path-reference` in its
# unmapped-kinds set, so this absence is a declaration and not an omission -- a
# kind that is neither mapped here nor declared there exits 2.
#
# ---------------------------------------------------------------------------
# Consumers
# ---------------------------------------------------------------------------
#
#   feature-005  harvest-declared.sh -- Pass 1a, the Knowledge Base scan (the
#                `kb-*` and `frontmatter-*` kinds below).
#                derive-edges.sh -- Pass 1b, typing feature-004's untyped
#                observations (the remaining kinds below). It adds no traversal of
#                its own; all typing happens through this map.
#
# ---------------------------------------------------------------------------
# Adding an entry
# ---------------------------------------------------------------------------
#
#   1. A new harvest kind must be added to the loader's closed kind list in the
#      same edit, or its absence here is indistinguishable from a mistake.
#   2. Choose field 4 from the vocabulary by DEFINITION, never by convenience: if
#      no relation's definition matches the observation, leave the kind unmapped
#      and let Pass 2 propose the edge. An invented mapping asserts something the
#      carrier does not evidence.
#   3. Fields 2 and 3 must be subsets of that relation's `passes` and
#      `endpoint_kinds`. If they are not, the vocabulary is what needs the change,
#      and that is feature-001's file, not this one.
#   4. Run the FULL profile generator (never a partial render) so every profile
#      copy and its emission manifest move together.
#   5. Submit through the project's normal review gate (reviewer ledger at
#      .aid/.temp/review-pending/<scope>.md, graded by grade.sh).
#
# ---------------------------------------------------------------------------

# <harvest-kind>|<emitting-provenances>|<kind-pairs>|<relation-label>
map:
  - kb-doc-section|derived|document->section|has-part
  - kb-section-section|derived|section->section|has-part
  - kb-doc-fact|derived|document->fact|has-part
  - kb-section-fact|derived|section->fact|has-part
  - kb-fact-anchor|declared|fact->source-artifact,fact->document|cites-as-evidence
  - kb-concept-definition|declared|document->concept|defines
  - kb-concept-mention|derived|document->concept,section->concept,fact->concept|mentions
  - frontmatter-see-also|declared|document->document|cross-references
  - frontmatter-sources-path|declared|document->source-artifact|documents
  - frontmatter-sources-url|declared|document->web-page|documents
  - kb-inline-path-citation|declared|document->source-artifact,section->source-artifact,fact->source-artifact|cites
  - kb-inline-doc-link|declared|document->document,section->document|mentions
  - kb-image-reference|declared,derived|document->image,section->image,fact->image|illustrated-by
  - kb-ext-key-citation|declared|document->web-page,section->web-page,fact->web-page|cites
  - invocation|derived|source-artifact->source-artifact|invokes
  - dependency|derived|source-artifact->source-artifact,source-artifact->image,source-artifact->web-page|depends-on
  - include|derived|source-artifact->source-artifact|depends-on
  - convention|derived|source-artifact->source-artifact|depends-on
  - image-reference|declared,derived|source-artifact->image|illustrated-by
