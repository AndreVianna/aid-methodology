# Keeps the SHA-pinned GitHub Actions in .github/workflows/ current.
# Actions are pinned to immutable commit SHAs (with a `# vN` comment) for
# supply-chain safety; dependabot opens weekly PRs that bump those pins.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
  # Watches the repo-root tooling manifest (package.json) -- a private, unpublished
  # manifest with no install tree of its own, holding the Playwright dependency the
  # aid-summarize visual-fidelity gate drives. It is never rendered into an adopter's
  # install and never ships. If this directory is ever wrong, Dependabot goes SILENT
  # rather than failing, so it is checked by nothing -- keep it in step by hand.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
