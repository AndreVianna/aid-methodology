name: coverage-parity

# Executed-assertion inventory parity gate (work-024 feature-001).
#
# WHY A SEPARATE LANE (not a step in test.yml's canonical-tests job):
#   test.yml's canonical suites run in parallel and are budgeted to finish in
#   ~3 min. coverage-parity.sh `collect` re-runs the ENTIRE canonical corpus
#   SERIALLY under --verbose (one suite at a time, so every executed PASS/FAIL
#   assertion can be attributed to its suite), which takes ~6-7 min. Folding
#   that into the canonical-tests job would roughly triple its wall-clock, so
#   it gets its own path-filtered lane that only fires when tests/** change.
#
# ADVISORY UNTIL BOOTSTRAPPED:
#   The gate diffs the live corpus against a committed baseline inventory
#   (tests/coverage-baseline.tsv). That baseline can only be captured in a
#   runtime-complete Linux env (pwsh + node + python3); the corpus hangs under
#   the local Windows/cygwin shell, so it is NOT committed from an authoring
#   worktree. Until a maintainer bootstraps it, the diff step exits 0 with a
#   ::warning:: (no spurious red on the wiring PR). Once the baseline lands the
#   lane self-activates and enforces parity.
#
# BOOTSTRAP RUNBOOK (one-time, by a maintainer):
#   1. Actions -> coverage-parity -> "Run workflow" on master with
#      bootstrap = true. This runs `coverage-parity.sh collect` and uploads a
#      `coverage-baseline` artifact holding coverage-baseline.{tsv,meta}.
#   2. Download that artifact and commit BOTH files to tests/ on master.
#   3. Re-run the lane (or push a tests/** change): with the baseline present
#      the diff step now enforces parity, and on master it should self-diff
#      clean (exit 0).
#
# EXIT-CODE CONTRACT (from tests/coverage-parity.sh):
#   0 clean | 1 parity violation | 2 usage (incl. baseline-not-found)
#   | 3 required runtime absent. Once bootstrapped, the diff step lets 1/2/3
#   surface as a job failure -- which is the point of the gate.

on:
  pull_request:
    branches: [master]
    paths:
      - 'tests/**'
      - '.github/workflows/coverage-parity.yml'
  push:
    branches: [master]
    paths:
      - 'tests/**'
      - '.github/workflows/coverage-parity.yml'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Capture a fresh baseline (upload as artifact to download + commit) instead of diffing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  coverage-parity:
    name: coverage-parity (executed-assertion inventory diff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Make helper + test scripts executable
        run: find canonical/aid/scripts tests/canonical -name '*.sh' -exec chmod +x {} +
      - name: Install jsdom (DOM oracle for the graph suites)
        shell: bash
        # This workflow needs jsdom for a sharper reason than test.yml does. `collect`
        # counts only "PASS:"/"FAIL:" lines (tests/coverage-parity.sh:223-224) and a SKIP
        # is neither -- so without jsdom the ~60 jsdom-gated graph assertions are not
        # recorded as skipped, they are ABSENT FROM THE INVENTORY ENTIRELY. A baseline
        # captured that way cannot notice them disappearing, which is the exact
        # false-green this gate exists to prevent, in the gate itself.
        #
        # Kept byte-for-byte in step with test.yml's canonical-tests job, and for the same
        # reasons: installed ALONE into a prefix OUTSIDE the repo (a root node_modules
        # would let a bare specifier resolve to a downloaded copy instead of the committed
        # vendor/ bytes), with the version read from the root manifest so there is one
        # place to bump. Both workflows must stay aligned -- a baseline collected with the
        # oracle and diffed without it would report every gated assertion as removed.
        run: |
          JSDOM_VER=$(node -e "process.stdout.write(require('./package.json').devDependencies.jsdom)")
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/jsdom-oracle" "jsdom@${JSDOM_VER}"
          echo "AID_GRAPH_JSDOM=$RUNNER_TEMP/jsdom-oracle/node_modules/jsdom/lib/api.js" >> "$GITHUB_ENV"
      - name: Assert test runtimes present (node + pwsh + python3 + jsdom)
        shell: bash
        run: |
          command -v node    >/dev/null || { echo "::error::node missing";    exit 1; }
          command -v pwsh    >/dev/null || { echo "::error::pwsh missing";    exit 1; }
          command -v python3 >/dev/null || { echo "::error::python3 missing"; exit 1; }
          [[ -f "$AID_GRAPH_JSDOM" ]] || { echo "::error::jsdom entry module missing at $AID_GRAPH_JSDOM — the graph DOM assertions would vanish from the inventory rather than skip"; exit 1; }
          # pathToFileURL, not a bare path: mirrors how the suites load the override
          # (graph-canvas-dom.mjs:138), so this guard passes iff they will.
          node -e "const { pathToFileURL } = require('url'); import(pathToFileURL(process.env.AID_GRAPH_JSDOM).href).then((m) => { if (typeof m.JSDOM !== 'function') { console.error('::error::jsdom resolved but exports no JSDOM constructor'); process.exit(1); } console.log('jsdom entry module exports JSDOM'); })"
          echo "node $(node --version) | $(pwsh --version) | $(python3 --version)"
      # Bootstrap: workflow_dispatch with bootstrap=true -> capture + upload for a maintainer to commit.
      - name: Bootstrap - capture baseline
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap
        shell: bash
        run: bash tests/coverage-parity.sh collect --out tests/coverage-baseline.tsv
      - name: Upload baseline artifact
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-baseline
          path: |
            tests/coverage-baseline.tsv
            tests/coverage-baseline.meta
      # Gate: PR / push. ADVISORY until a baseline is committed: self-activates once tests/coverage-baseline.tsv exists.
      - name: Coverage-parity diff (advisory until baseline bootstrapped)
        if: '!(github.event_name == ''workflow_dispatch'' && inputs.bootstrap)'
        shell: bash
        run: |
          if [[ ! -f tests/coverage-baseline.tsv ]]; then
            echo "::warning::coverage baseline not yet bootstrapped (run this workflow via workflow_dispatch with bootstrap=true, download the artifact, and commit tests/coverage-baseline.{tsv,meta}). Gate is advisory until then."
            exit 0
          fi
          bash tests/coverage-parity.sh diff \
            --baseline tests/coverage-baseline.tsv \
            --allow    tests/coverage-rehome-allowlist.tsv \
            --accept   tests/coverage-accepted-removals.tsv \
            --collect
