name: Docs

# Builds the Astro Starlight site under site/ and deploys it to GitHub Pages
# at https://aid.casuloailabs.com.  Decoupled from release.yml: it does not
# modify or depend on the release pipeline.  Pages deploys only from master
# (push or manual re-deploy) — the github-pages environment permits master-ref
# deploys only, so a tag/release ref is rejected.
#
# No step after `npm ci` uses the network.  The version the site shows is read
# from the repo-root VERSION file at build time; the skill, agent and settings
# pages are committed output of site/scripts/gen-facts.mjs, checked below.
#
# Pause switch: while the repository variable DOCS_DEPLOY_PAUSED is 'true', a
# push to master builds and tests the site but does not publish it -- so docs for
# unreleased work on master do not go live ahead of the release that installs it.
# A manual workflow_dispatch always publishes.

on:
  push:
    branches: [master]
    paths:                      # only rebuild when site inputs change
      - 'site/**'
      - 'canonical/**'          # gen-facts.mjs --check compares the committed
                                # skill, agent and settings pages with it, so a
                                # canonical-only commit must still be checked
      - 'VERSION'               # read at build time for the version display
      - '.github/workflows/docs.yml'
  pull_request:                 # M2: gate PRs to master — build-validate site inputs before merge
    branches: [master]          # (the `deploy` job is skipped on PRs; build only)
    paths:
      - 'site/**'
      - 'canonical/**'
      - 'VERSION'
      - '.github/workflows/docs.yml'
  workflow_dispatch:            # manual re-deploy

# Least-privilege: read the repo, write the Pages deployment, mint the OIDC
# token deploy-pages exchanges.  No contents:write, no issues/pull-requests.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deploy at a time; a newer push supersedes an older
# queued run, but never cancel a deploy mid-publish.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: build (astro build → Pages artifact)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'site/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The skill, agent and settings pages under site/src/content/docs/ are
      # committed output of gen-facts.mjs. --check writes nothing. Exit 1: a page
      # differs from what canonical/ produces now; fix by running
      # `node site/scripts/gen-facts.mjs` and committing its output. Exit 2: an
      # input error (such as a skill with no group) or a crash; read the message.
      # Node built-ins only, so it runs before `npm ci` and fails fast.
      - name: Check site facts against canonical/
        run: node site/scripts/gen-facts.mjs --check

      - name: Install deps (reproducible)
        working-directory: site
        run: npm ci

      # Gate on the site suite: the build, internal links, the facts check, and
      # accessibility + structure checks on every built page. After `npm ci`
      # because the test tools are devDependencies; before the build step so a
      # red suite never produces a Pages artifact.
      - name: Test (site suite)
        working-directory: site
        run: npm test

      - name: Build Astro Starlight site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy (Pages)
    needs: build
    # M2: build-validate on PRs, but only ever DEPLOY on a real push to master / a release.
    # A push deploys unless DOCS_DEPLOY_PAUSED is 'true'; a manual dispatch always deploys.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DOCS_DEPLOY_PAUSED != 'true')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
